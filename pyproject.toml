[project]
name = "soccer-highlight-analyzer"
version = "0.1.0"
description = "Ingest a full broadcast soccer match and produce per-player highlight reels + a stat card."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

# Core deps: kept lean so `uv pip install -e .` resolves fast and never pulls torch.
# Optional/heavy stacks (torch, transformers, ocr, api) live in [project.optional-dependencies].
dependencies = [
    "pydantic>=2.7",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "typer",
    "rich",
    "opencv-python",
    "av",
    "scenedetect[opencv]",
    "supervision",
    "tqdm",
    "python-dotenv",
    "scipy",
    # src/identity/jersey_vlm.py (ADR-15): plain HTTP POST to the Gemini API for jersey-number
    # cross-checking. Apache-2.0, already relied on transitively; made an explicit core dep since
    # it's now load-bearing, not incidental.
    "requests",
]

[project.optional-dependencies]
# Stage 2 perception: RF-DETR (Apache-2.0) detector + SAHI tiling + torch runtime.
# NEVER add ultralytics or boxmot here (AGPL-3.0, forbidden by Golden Rule 6 / CLAUDE.md §7).
detect = [
    "rfdetr",
    "sahi",
    "torch",
    "torchvision",
    "timm",
]
# Stage 3 team assignment: SigLIP embeddings + UMAP + KMeans clustering.
team = [
    "transformers",
    "umap-learn",
    "scikit-learn",
]
# Phase 2 identity: jersey-number OCR.
ocr = [
    "easyocr",
]
# Purpose-built jersey-number reading (CLAUDE.md §7 "mkoshkina/jersey-number-pipeline CHECKPOINTS
# ONLY" row, owner-authorized 2026-08-31): a legibility gate (own resnet34+linear model
# definition, src/identity/legibility.py) + PARSeq (src/identity/jersey_parseq.py), fine-tuned on
# SoccerNet, run ahead of the existing EasyOCR/Gemini chain. `strhub` is the REAL upstream
# `baudm/parseq` package (Apache-2.0) -- not any code from mkoshkina's repo -- installed as a git
# dependency since it has no PyPI release; it is pinned by commit via `uv.lock`/CI, not by tag,
# since upstream cuts none. `gdown` (MIT) fetches the two NC-restricted checkpoint FILES into
# `models/jersey-parseq-soccernet/` (never installed as a code dependency of the checkpoints
# themselves -- see that directory's own MODEL_CARD.md for the license scoping). `pytorch-lightning`
# (Apache-2.0) and `nltk` (Apache-2.0) are `strhub`'s own transitive runtime imports
# (`strhub.models.base` imports `nltk.edit_distance`; `PARSeq.load_from_checkpoint` is a
# `pytorch_lightning.LightningModule` classmethod) -- both permissive, verified before adding.
jersey_parseq = [
    "gdown",
    "strhub @ git+https://github.com/baudm/parseq.git",
    "pytorch-lightning",
    "nltk",
]
# scripts/download_soccernet.py: pulls one labeled SoccerNet broadcast clip for eval/testing
# (CLAUDE.md §9.1/§7). MIT-licensed package; the underlying *video data* is NDA-gated/research-
# education-only regardless of this package's own license -- see the script's docstring.
soccernet = [
    "SoccerNet",
]
# Thin API serving the pipeline to apps/web.
api = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    # Plan Stage 3 ("streamed-gathering-treehouse", 2026-09-14): renders statcard.pdf
    # (src/pipeline/statcard_pdf.py) alongside statcard.md. BSD-3-Clause -- clean under Golden
    # Rule 6, see CLAUDE.md §7. Imported lazily (never at module import time) so the rest of the
    # pipeline stays importable without this extra installed.
    "reportlab",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# `strhub @ git+https://...` in the `jersey_parseq` extra is a direct reference; hatchling refuses
# to build the project metadata at all without this opt-in, which is invisible on a machine whose
# venv predates that extra but breaks every FRESH `pip install -e .` (found 2026-09-16 while
# dry-running docker/runpod_bootstrap.sh on a clean clone).
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer's documented CLI pattern is `param: T = typer.Option(default, ...)` -- the "function
# call in a default argument" this rule warns about is typer's own API, not a mutable-default
# footgun, so every typer CLI entrypoint in this repo trips it. Ignored project-wide rather than
# per-line since every future `src/pipeline/*_cli.py` will use the same pattern.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
