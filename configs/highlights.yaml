# Stage 5/6 — highlights (CLAUDE.md §5 Stage 5/6). Auto target selection (human seam intact),
# rank, dedupe, cut, and export the reel.

selection:
  # Stage 5 target-player selection (CLAUDE.md Golden Rule 4/7, §3.2 consequence 1): the arrow
  # prior + within-take geometric/temporal fragment stitching, NEVER a jersey number.
  arrow_match_tolerance_s: 0.15 # match an arrow-hinted frame to a track's own box within this
  # many seconds — arrow hints and tracks are both sampled at ~configs/hardware.yaml
  # stages.detect.fps_sample=10 (~0.1s apart), so 0.15s covers one sample step of slop.
  arrow_match_max_dist_px: 200 # MEASURED 2026-08-24 on clip2 (this task, see run report): the
  # arrow's tip sits 51-129px from its actual target track's centroid across all 30 hinted frames
  # (it marks the player's head/shoulder area, not the detection box's own centre) — 200px is a
  # generous margin above the largest observed gap while staying well under typical player-to-
  # player spacing at this camera's wide framing, so it won't accidentally snap to a neighbour.
  arrow_min_vote_share: 0.4 # ⚠️ MEASURED 2026-08-25 on clip4 (this task's own Stage 5 build): the
  # arrow signal is NOT uniformly reliable across every take. take 2's votes were dominated by one
  # track (23/30 = 0.77 share) and take 3's by another (23/38 = 0.61) — both look like genuine
  # arrows (clip4 is a 4-venue COMPILATION, CLAUDE.md §3.2 — each source sub-clip plausibly had
  # its own intro arrow). But take 0's 148 "hits" were scattered almost evenly across 5+ different
  # tracks (top share only 0.20) — almost certainly a recurring false-positive red object the
  # existing arrow_max_area_px/arrow_min_height_width_ratio guards didn't fully catch, not a real
  # target-marking arrow. Below this share, a take's arrow evidence is treated as unreliable and
  # `select_targets` falls back to the heuristic seed instead of reporting a falsely-confident
  # `arrow_vote` (0.4 sits cleanly between the rejected 0.20 and the accepted 0.61/0.77).
  stitch_max_gap_s: 1.5 # join two SAME-take fragments only if the time gap between the timeline's
  # nearest end and the candidate is under this many seconds — a fragment reappearing later than
  # this is left unstitched (ambiguous re-acquisition is a Phase-2 Re-ID problem, not this).
  stitch_max_dist: 3.0 # spatial-jump cap, same "bbox-heights" unit as configs/events.yaml sprint
  # (pixel distance between the timeline's last known centroid and the candidate's first centroid,
  # divided by their mean bbox height). Not derived from sprint_speed_threshold * stitch_max_gap_s
  # on purpose (that product is ~6) — kept independently tunable since a lost-then-reacquired
  # track's real path is rarely a straight line at that speed.
  team_match_confidence_threshold: 0.5 # team agreement is used ONLY as a stitching TIEBREAKER
  # (never a hard filter — ADR-12: team labels can be low-confidence/unbalanced on some takes),
  # and only when BOTH candidate fragments' team_confidence clear this bar.
  join_retention_factor: 0.92 # each additional fragment stitched into a timeline multiplies its
  # running confidence by this factor — every join is itself an inference on top of the raw
  # tracker output (not ground truth), so a heavily-fragmented, heavily-stitched timeline reads as
  # less certain than one long unbroken track, without making stitching pointless.
  heuristic_fallback_confidence_ceiling: 0.35 # HARD CEILING when a take has no arrow evidence at
  # all (`selection_method: heuristic_fallback`) — always visibly less confident than an
  # arrow-anchored pick, never silently blended with it (CLAUDE.md task spec).
  manual_override_confidence: 1.0 # confidence recorded when a human supplies `--track-id` (the
  # actual Phase-1 human-in-the-loop seam, Golden Rule 4) — the one case allowed to read as fully
  # certain, because a human, not an inference, made the call.
  heuristic:
    # No-arrow fallback scoring (CLAUDE.md task spec: "longest-lived track with highest mean
    # detection confidence nearest frame centre"). Each raw signal is min-max normalised across
    # that take's own candidate tracks before weighting, so the three terms stay comparable
    # regardless of each signal's raw scale.
    min_track_duration_s: 0.5 # ignore tracks shorter than this when picking a fallback seed —
    # too little evidence to trust as "the" target over a longer-lived alternative.
    duration_weight: 0.4
    confidence_weight: 0.3
    center_weight: 0.3 # closer to frame centre scores higher — a broadcast/wide-shot framing
    # convention (the camera operator tends to keep the ball/play, and often the tracked player,
    # near the middle), a weak but free prior when there is no arrow to anchor on.

attribution:
  # A SHOT event carries no `player_track_id` (src/events/shots.py — it's a ball-only heuristic),
  # so Stage 6 ranking must decide whether it belongs to the SELECTED target timeline before it
  # can count toward that player's reel/stats (never silently credited — Golden Rule 5).
  shot_proximity_bbox_heights: 4.0 # attribute a shot to the timeline only if the timeline's own
  # nearest-in-time position is within this many (timeline-local) bbox-heights of the ball at the
  # event's t_start — generous enough to allow for the ball being played away from the striker's
  # exact centroid, tight enough to exclude a shot clearly taken by some other player on screen.
  max_time_gap_s: 1.0 # timeline-position lookup tolerance for the proximity check above — beyond
  # this the timeline's own position is considered unknown at that instant, and the shot is left
  # unattributed rather than guessed.

clip:
  pre_roll_s: 3.0 # seconds of context included before an event's t_start
  post_roll_s: 2.0 # seconds of context included after an event's t_end
  snap_to_take_boundaries: true # never let a clip cross a camera cut (Golden Rule 3)

dedupe:
  iou_over_time_threshold: 0.6 # two candidate clips whose TIME RANGES overlap (intersection over
  # union of the two [t_start, t_end) ranges, after pre/post-roll + take-snapping) by MORE than
  # this fraction are considered duplicates — only the higher-ranked one is kept.

rank:
  # Higher weight = ranked earlier in the reel, per CLAUDE.md §5 Stage 6 priority order:
  # goal > assist > shot > dribble > key_pass > sprint > pass. Only goal/shot/sprint exist in
  # Phase 1; the rest are reserved keys for when Phase 2+ adds those event types.
  weights:
    goal: 100
    assist: 80
    shot: 60
    dribble: 40
    key_pass: 30
    sprint: 20
    pass: 10
  confidence_weight: 0.5 # rank_score = weight[type] * (1 + confidence_weight * event.confidence)
  # — confidence nudges ordering within/across types without ever letting a low-value type
  # outrank a high-value one on confidence alone (see src/highlights/ranking.py).

export:
  max_clips: 15
  target_reel_seconds: null # null = no cap; otherwise the lowest-ranked tail clips are trimmed
  # (best-first order preserved) until the remaining total fits.

click_reid:
  # Click-anchored re-identification (`src/track/click_reid.py`): when a human clicks a player in
  # the web UI, `stitch_timeline` already extends the click forward through nearby same-take
  # fragments; this block WOULD extend it FURTHER across a break that chain's own gap/distance
  # thresholds (selection.stitch_max_gap_s/stitch_max_dist above) didn't bridge, using the clicked
  # player's own measured colour (team cluster) + height as corroborating evidence (owner request,
  # 2026-09-01: "keep in mind the colour and jersy number and height").
  #
  # ⛔ STILL DISABLED BY DEFAULT, 2026-09-01 -- re-measured after wiring jersey-number
  # corroboration (`src/pipeline/run.py` now calls `collect_track_jersey_digits` and passes a real
  # `jersey_by_track_id` into `extend_chain_with_profile`), and the SAME failure reproduced.
  #
  # Original finding: a live end-to-end run on `chelsea_burnley_target10` (click on the real #10,
  # raw track 201) extended the chain from 2 fragments to 36 and one of those 36 (raw track 186)
  # put the red TARGET box on a DIFFERENT physical player (a Burnley player in claret, not
  # Chelsea's blue #10) -- confirmed by eye on the rendered frame.
  #
  # Follow-up (same day): jersey-number reads were wired in as a real corroborating/veto signal
  # and DID fire (30/231 tracks got a confident PARSeq read this run) -- but re-running the exact
  # same click produced the exact same result: track 186 STILL joined the chain, still a different
  # physical player (re-confirmed by eye on a fresh crop). Root-caused further, not assumed:
  # `Track.team` itself is degenerate on this take, not just `team_confidence` -- **194 of 231
  # tracks read `team=1`, only 35 read `team=0`**, i.e. ADR-12's own colour clustering has failed
  # to separate Chelsea-blue from Burnley-claret into two real clusters here, collapsing most of
  # BOTH teams onto one label. Track 186 and the real target (201) both read `team=1`, so the
  # "same team" check passes trivially -- it is not corroborating evidence, it is noise. Jersey
  # reads did not catch this specific pair: track 186 has only 13 boxes (~1.2s lifespan), too
  # short to accumulate a confident majority read, so it carried NO jersey evidence and fell
  # through to the broken colour+height test alone.
  #
  # Conclusion: colour-based corroboration cannot be trusted on a take where team clustering
  # itself has collapsed, and jersey corroboration only helps candidates that live long enough to
  # be read -- exactly the short, fast-churning fragments that most need help are the ones jersey
  # reads can't reach. This needs a take-level "is team clustering even usable here" gate (e.g.
  # requiring real inter-cluster separation, not just a confidence number) before colour can be
  # trusted at all -- not built yet. Until then: `stitch_timeline`'s own tight gap/distance
  # thresholds (unaffected by any of this) remain the only chain extension applied, and a click
  # that loses its box across a real fragmentation break needs a fresh click rather than automatic
  # bridging. Do not re-enable without a real take-level colour-separation check, re-measured on
  # real footage.
  enabled: false
  min_height_ratio: 0.60 # ⚠️ REASONED-BUT-UNMEASURED (same epistemic status as
  # `configs/annotations.yaml: colour_reference_lab`'s non-blue entries) -- box height shrinks with
  # camera-motion/depth between two fragments of the SAME player; 0.60 is a conservative floor
  # meant to tolerate normal depth change while still rejecting an obviously differently-sized
  # person (a 6ft midfielder vs a goalkeeper standing much closer to camera). Revisit the moment a
  # real labeled slice exists to measure the true same-player height-ratio distribution.
  max_jersey_samples_per_track: 8 # 2026-09-01 follow-up to the disabled note above: jersey-number
  # agreement is the fix for the measured team_confidence failure (colour alone let a different
  # physical player join the chain). `configs/annotations.yaml: jersey_reid.max_frames_per_candidate`
  # measured ~21% of crops clear the legibility gate on this same footage, and was raised to 20 for
  # a SMALL pool of near-time candidates. This call site scans EVERY track in the take (up to 232 on
  # `chelsea_burnley_target10`), so the per-track budget is kept smaller to bound total added
  # runtime to one click -- 8 tries still gives a real shot at ADR-15's own
  # `identity.yaml: aggregation.min_agreeing_frames` (2) bar at that yield, without multiplying by
  # 20x across a whole take's worth of tracks. Revisit if real runs show this too thin.
