# Stage 1 — temporal structure (CLAUDE.md §5 Stage 1, superseded by ADR-7).
# ADR-7: shot-boundary/cut (scenedetect) detection now runs for EVERY profile, not just
# `broadcast` — CLAUDE.md §3.2(2) found clip4 (single-camera) still contains a real cut at
# t=60.07s, and gating cut detection on profile=="broadcast" would have let tracking run
# straight across it and corrupt IDs. Only the replay/close-up classifier and scoreboard OCR
# below stay gated on profile=="broadcast"; IDs still reset at every detected cut (Golden Rule 3).
# fps_sample for this stage lives in configs/hardware.yaml (stages.shots.fps_sample).

scenedetect:
  # Runs unconditionally (ADR-7). This is the ONE place `scenedetect` params live — the Stage 0.5
  # profiler (src/pipeline/profiler.py) calls src/shots/boundaries.py for its n_cuts/cuts_per_min
  # rather than re-reading its own copy, so the knob isn't duplicated across configs/profile.yaml.
  detector: content # PySceneDetect ContentDetector, driven frame-by-frame over our own NVDEC
  # decode (src/common/video.decode_frames) rather than scenedetect's own (slow, CPU-only opencv
  # backend) VideoStream, so cut detection reuses the same decode path as the rest of the pipeline.
  downscale_width: 640 # decode width fed to ContentDetector; matches the 640px scale CLAUDE.md
  # §3.2 used for its own independent ffmpeg cut measurement, and is fast (small frames + NVDEC).
  #
  # threshold: measured 2026-08-24 on input/clip4 77.mp4 (the only clip with a real cut) at this
  # exact downscale: the true venue cut at t=60.07s scores content_val=57.5, and two further real
  # cuts (confirmed by eye — see notes below) at t=73.6s/t=87.2s score 45.6/61.8. Meanwhile
  # PySceneDetect's stock default (27.0) also fires on three frames that are NOT cuts — a person
  # entering the extreme foreground / fast pan at t=14.5s, t=47.0s and t=99.6s (content_val
  # 32.0/29.5/28.4) — because those are within-take foreground-object flicker, not scene changes
  # (confirmed by extracting frames around each timestamp: same venue/camera before and after).
  # 38.0 sits in the clean gap between the highest false-positive (32.0) and lowest real cut
  # (45.6), so it keeps the 3 real cuts and drops the 3 false ones. NOT tuned to force a
  # predetermined cut *count* — see the profiler's docstring/report for the full investigation.
  threshold: 38.0
  min_scene_len_frames: 15 # ignore cuts shorter than this many frames (debounces flash/graphic cuts)
  #
  # ADR-16 (CLAUDE.md §5.1): a single fixed threshold does not generalize across a heterogeneous
  # multi-match compilation. `Jordan Thomas Highlight Video.mp4` (§3.3) has real cuts scoring as
  # low as ~21-27 (stable 13-cut set across thresholds 21.0/24.0/27.0), while clip4's three
  # CONFIRMED FALSE-POSITIVE foreground-crossings (ADR-7) score up to 32.0 — no single global
  # threshold keeps clip4's false positives out AND catches this video's real cuts. `overrides` is
  # keyed by the exact slug `src.common.io.work_dir_for()` produces for the video's filename stem
  # (lowercased, non-alphanumerics -> `_`); `detect_takes()` looks itself up here FIRST and falls
  # back to `threshold` above when the slug isn't present, so the original 5 clips (no entry here)
  # are provably unaffected. `jordan_thomas_highlight_video: 24.0` was verified by eyeballing a
  # before/after contact-sheet frame pair at each of the 13 measured cut timestamps (same
  # discipline ADR-7 used) before being locked in here.
  overrides:
    jordan_thomas_highlight_video: 24.0

replay:
  # Broadcast-gated (profile == "broadcast" only, ADR-7). Heuristic replay/close-up flags;
  # refined once a dedicated shot-type classifier is wired in.
  gated_on_broadcast_profile: true
  min_take_seconds: 1.0 # takes shorter than this are suspect (likely a replay sting/transition)
  closeup_bbox_area_ratio: 0.35 # a single dominant detection covering this fraction of frame area => closeup
  logo_wipe_black_frame_ratio: 0.9 # fraction of near-black pixels that flags a transition/wipe frame

ocr:
  # Broadcast-gated (profile == "broadcast" only, ADR-7). CLAUDE.md §3.2(3): the current footage
  # has no scoreboard at all, so on it this must report "not available", never a guessed value
  # (Golden Rule 5) — see configs/events.yaml `goal` block.
  gated_on_broadcast_profile: true
  engine: easyocr # Apache-2.0 (CLAUDE.md §7); requires the `ocr` extra
  scoreboard_region_relative: [0.0, 0.0, 0.25, 0.12] # [x1,y1,x2,y2] as fraction of frame, typical scoreboard corner
