# Stage 1 — temporal structure (CLAUDE.md §5 Stage 1, superseded by ADR-7).
# ADR-7: shot-boundary/cut (scenedetect) detection now runs for EVERY profile, not just
# `broadcast` — CLAUDE.md §3.2(2) found clip4 (single-camera) still contains a real cut at
# t=60.07s, and gating cut detection on profile=="broadcast" would have let tracking run
# straight across it and corrupt IDs. Only the replay/close-up classifier and scoreboard OCR
# below stay gated on profile=="broadcast"; IDs still reset at every detected cut (Golden Rule 3).
# fps_sample for this stage lives in configs/hardware.yaml (stages.shots.fps_sample).

scenedetect:
  # Runs unconditionally (ADR-7), same engine as the Stage 0.5 profiler.
  detector: content # PySceneDetect ContentDetector
  threshold: 27.0
  min_scene_len_frames: 15

replay:
  # Broadcast-gated (profile == "broadcast" only, ADR-7). Heuristic replay/close-up flags;
  # refined once a dedicated shot-type classifier is wired in.
  gated_on_broadcast_profile: true
  min_take_seconds: 1.0 # takes shorter than this are suspect (likely a replay sting/transition)
  closeup_bbox_area_ratio: 0.35 # a single dominant detection covering this fraction of frame area => closeup
  logo_wipe_black_frame_ratio: 0.9 # fraction of near-black pixels that flags a transition/wipe frame

ocr:
  # Broadcast-gated (profile == "broadcast" only, ADR-7). CLAUDE.md §3.2(3): the current footage
  # has no scoreboard at all, so on it this must report "not available", never a guessed value
  # (Golden Rule 5) — see configs/events.yaml `goal` block.
  gated_on_broadcast_profile: true
  engine: easyocr # Apache-2.0 (CLAUDE.md §7); requires the `ocr` extra
  scoreboard_region_relative: [0.0, 0.0, 0.25, 0.12] # [x1,y1,x2,y2] as fraction of frame, typical scoreboard corner
