# Stage 4 — events (CLAUDE.md §5 Stage 5). Phase 1: sprints (speed heuristic), shots (heuristic,
# low-confidence ceiling), goals (scoreboard delta — N/A on this footage) only. No
# passes/touches/tackles (CLAUDE.md §12 Don'ts).
#
# ⚠️ ADR-6: there is NO metric pitch homography on this footage (`src/pitch/` is an empty seam —
# CLAUDE.md §3.2(4): the pitch lines here are too sparse/non-standard for the assisted 4-point
# calibration ADR-3 describes). Every speed figure below is therefore in a NORMALISED PIXEL unit
# we define ourselves, never m/s (Golden Rule 5) — see `sprint.unit`/`shot.unit` comments.

ball:
  # Stage 1 of the evidence-based event redesign (owner spec, 2026-09-02): the ball trajectory
  # state series every detector below consumes (src/events/ball_track.py). Not a new detector --
  # smooths/compensates the SAME Stage 2 ball_detections.parquet already produced.
  min_conf_for_state: 0.3 # identical value/reasoning to touch.min_ball_conf/possession.min_ball_conf
  # below (kept independently named per-consumer, same pattern as those two) -- a sample below this
  # is dropped from the state series entirely (a hole, never a low-confidence BallState object).
  smoothing_window_frames: 12 # ⚠️ MEASURED, 2026-09-02, on chelsea_burnley_target10 (real ball
  # detections, camera-motion-compensated): swept 3/5/8/12/20 against every proximity-qualifying
  # touch candidate's own delta_v. Raw ball-centroid jitter dominates the signal at small windows
  # (median delta_v 7.53 bbox-h/s at window=3, still 4.80 at window=8) and never fully disappears
  # even at window=20 (median 2.33) -- ball detection on this footage is inherently noisy (small,
  # fast object, CLAUDE.md's own "ball is the weak spot"). 12 is where the median (3.43) and the
  # p25 (0.94) both settle into a stable, much-reduced range without over-smoothing into the
  # 20-sample window's own risk of blurring two adjacent real touches together. Deliberately
  # LARGER than shot.smoothing_window_frames=3 -- that scalar feeds a sustained-direction segment
  # test tolerant of noise; this feeds a single before/after DELTA comparison
  # (touch.min_velocity_change below), which is far more noise-sensitive.
  max_gap_bridge_s: 0.5 # a gap between two CONFIDENT ball samples wider than this breaks velocity
  # computation across it (emits known=False right after) -- Stage 2's own
  # configs/detect.yaml: ball_interpolation.max_gap_frames already declined to bridge a gap this
  # wide with a real interpolated position, so this module must not manufacture a velocity across
  # a hole Stage 2 itself found too large to trust (owner: "do NOT immediately create a
  # touch/pass/shot/goal because the ball disappeared").

kit_colour:
  # Stage 5b of the evidence-based event redesign (owner request 2026-09-02: "also add the
  # player jersy color for passes and assist") -- src/events/kit_colour.py. A grass-suppressed
  # measurement of a player's OWN kit colour, compared against
  # configs/annotations.yaml: colour_reference_lab (the same reference table manual-mode
  # association already uses), used as the PRIMARY teammate-vs-opponent signal for pass/assist
  # attribution -- ahead of jersey-number agreement and team-cluster quality.
  min_kept_pixels: 20 # a crop where fewer than this many pixels survive grass suppression has
  # essentially no shirt visible (heavy occlusion/motion blur) -- treated as no sample, never a
  # guess from what's left.
  min_kept_pixel_frac: 0.15 # MEASURED 2026-09-02 on chelsea_burnley_target10: real kept-kit
  # fractions across 6 visually-confirmed tracks ranged 31%-74% depending on pose/occlusion, with
  # a genuine sample as low as 31% still usable (verified against ground truth). Below 15% the
  # remaining pixels are almost certainly background bleed at the crop edges, not shirt.
  same_team_max_dist: 8.0 # ⚠️ REASONED FROM A SMALL REAL SAMPLE (15 pairs, 6 visually-confirmed
  # tracks), not exhaustively validated -- same epistemic status as several other thresholds in
  # this file. Measured 2026-09-02, direct pairwise CIELAB distance (src/events/kit_colour.py::
  # kit_colour_same_team -- NOT compared against colour_reference_lab, see that function's own
  # docstring for why): same-team pairs ranged 3.4-23.4 apart, cross-team pairs ranged 9.8-42.4
  # apart -- the ranges OVERLAP, so this and diff_team_min_dist below form a two-sided gate with
  # an honest gap between them rather than one threshold. At (8.0, 24.0) every one of the 15
  # measured pairs that clears either gate is classified correctly (0 wrong verdicts), INCLUDING
  # the real click-to-track validation pair from earlier the same day (Chelsea blue #10 vs
  # Burnley claret #21, dE=24.5 -- this is why the gate sits at 24.0, not a rounder 25.0: the
  # highest observed SAME-team distance is 23.4, so 24.0 is the tightest gate that both stays
  # above every same-team pair AND still resolves that specific real pair confidently). 7 of 15
  # pairs still fall into the undecided gap, matching the owner's own stated preference for pass
  # counting ("strict -- fewer, high-confidence"): a genuinely ambiguous read falls through to
  # jersey number / team-cluster quality rather than risk crediting the wrong team.
  diff_team_min_dist: 24.0 # see same_team_max_dist immediately above -- the other side of the
  # same measured gate.

sprint:
  # unit = "bbox-heights per second": a track's smoothed centroid displacement (px) / dt, divided
  # by the mean bbox height of the two boxes being diffed. This self-scales with the player's own
  # apparent size (near players are physically taller in pixels AND cover more pixels/second for
  # the same real speed; dividing by height partially cancels that perspective effect) — a crude,
  # documented proxy, NOT a calibrated metric. Every sprint Event.evidence carries
  # `"calibrated": false` and `"unit": "bbox_heights_per_second"` (Golden Rule 5 / ADR-6).
  smoothing_window_frames: 5 # trailing moving-average window (in SAMPLED frames, i.e. at
  # configs/hardware.yaml stages.track.fps_sample) applied to the raw (cx, cy) centroid series
  # before differencing, so single-frame detector jitter doesn't register as a speed spike.
  sprint_speed_threshold: 1.0 # ⚠️ RECALIBRATED 2026-08-25 against REAL measured speed on both
  # available tracked clips (this task's own Stage 4 build) — the original placeholder (4.0,
  # picked before any real track existed to measure) turned out to sit ABOVE the observed max
  # instantaneous speed on clip2 (max 3.70 bbox-heights/s across all 47 tracks) and produced ZERO
  # sprint events on either clip. Measured instantaneous per-sample speed distribution: clip2
  # (1977 samples, 40 usable tracks) mean=0.66, median=0.46, p90=1.67, p95=2.10, max=3.70; clip4
  # (17885 samples, ~640 usable tracks across 4 takes) mean=0.72, median=0.46, p90=1.80, p95=2.31
  # — closely consistent between the two clips despite very different venues/player counts. 1.0
  # sits between the median and p90 on both (i.e. "notably faster than typical movement, not
  # exceptional"); combined with the SUSTAINED >=1s duration requirement below, it yields a
  # real, selective set of segments (14/40 usable tracks on clip2, ~116/640 on clip4), not a
  # near-constant trigger — see the Stage 4-6 run report for the exact per-clip counts.
  sprint_min_duration_s: 1.0 # minimum SUSTAINED duration above threshold to count as a sprint —
  # matches configs/events.yaml's original Phase-0 scaffold default (a fast 1-2 stride burst is
  # noise; a genuine sprint holds for at least a second).
  sprint_merge_gap_s: 0.5 # merge two qualifying runs separated by a gap STRICTLY UNDER this many
  # seconds (a brief detector miss/occlusion mid-sprint shouldn't split one sprint into two
  # events) — see src/events/segments.py::find_threshold_segments for the exact boundary semantics.
  min_track_boxes: 5 # a track shorter than this has too few samples for a trustworthy speed
  # series at all (the moving-average window itself is 5) — skipped outright, not scored at 0.
  uncalibrated_confidence_penalty: 0.5 # multiplicative penalty applied to EVERY sprint's
  # confidence because it is a pixel-unit, not metric, speed estimate (ADR-6) — never allowed to
  # read as confidently as a calibrated measurement would.

shot:
  # Heuristic ONLY, from `ball_detections.parquet` (src/detect/ball.py) — there is no goal-position
  # model or pitch homography on this footage (ADR-3), so "toward a goal" is approximated as "the
  # ball moves fast and consistently toward one horizontal side of the frame for a sustained
  # window". This is a coarse stand-in that will also fire on a hard clearance, a long cross-field
  # pass, or a fast dribble toward either touchline end — expect LOW PRECISION (documented, not
  # papered over, in the Stage 4 report: see src/events/shots.py module docstring).
  # unit = "frame-widths per second": ball centroid displacement (px) / dt, divided by the
  # decoded frame's own width in pixels — self-scaling across clips at different decode
  # resolutions, still never a metric unit (ADR-6).
  smoothing_window_frames: 3 # the ball moves faster/more erratically than a player; a shorter
  # smoothing window than sprint's so a genuine fast strike isn't smeared away.
  ball_speed_threshold: 0.12 # ball must exceed this many frame-widths/second, sustained, to be a
  # shot candidate — informal calibration: crossing the whole frame width in under ~8s of play is
  # unremarkable ball movement; sustained motion faster than ~1 frame-width per 8s window is not.
  min_duration_s: 0.3 # a real strike's fast phase is brief — do not require sprint-length sustain
  merge_gap_s: 0.3 # merge candidate windows separated by a short ball-tracking gap (occlusion,
  # SAHI miss) under this many seconds — see configs/detect.yaml ball_interpolation.max_gap_frames
  # for the (separate) raw-detection gap-filling knob this compounds with.
  direction_consistency_ratio: 0.7 # of all frame-to-frame x-steps inside a candidate window, at
  # least this fraction must share the sign of the window's own net x-displacement — rejects a
  # window where the ball merely jittered fast (bouncing, being contested) rather than travelling
  # in one sustained direction, which is the whole "toward a goal end" proxy this heuristic relies on.
  # ⚠️ MEASURED 2026-08-25 on clip2: 4 candidate windows cleared `ball_speed_threshold` (peaks
  # 4.46-8.30 frame-widths/s) but their direction consistency was only 0.31-0.61 — NONE cleared
  # 0.7, so clip2 emits ZERO shot events. This was left AS-IS rather than lowered to manufacture a
  # result (Golden Rule 5: the honest response to a weak signal is fewer/no events) — see the
  # Stage 4-6 run report for the full "is this heuristic meaningful signal or noise" discussion.
  min_ball_conf: 0.3 # ignore ball detections below this confidence when building the speed series
  # — this also softly deweights long interpolated stretches, since
  # configs/detect.yaml:ball_interpolation.interpolated_conf_penalty already knocks an
  # interpolated BallDetection's own confidence down before it ever reaches this filter.
  max_confidence: 0.4 # HARD CEILING (Golden Rule 5): this is a coarse ball-motion heuristic with
  # no goal-position awareness, not a shot detector — never allowed to read as more certain than
  # "worth a human glance".
  min_confidence: 0.15 # floor for a qualifying window's OWN computed confidence (see
  # src/events/shots.py) — combined with configs/events.yaml confidence.min_emit_confidence below
  # as the final emit gate.

goal:
  # ADR-17 (2026-08-27) — REAL scoreboard-OCR-delta goal detection, no longer dead code. Still
  # reports "not available" on all 5 original clip<N>.mp4 + jordan_thomas_highlight_video (§3.2(3):
  # none of them has a scoreboard graphic anywhere) -- verified by an actual run against their own
  # cached work/<slug>/ artifacts (this task), not just inferred. See src/events/goals.py.
  #
  # ⚠️ Every default in this block is a REASONED-BUT-UNMEASURED placeholder, same epistemic
  # status as `save.save_gk_proximity_px` above: this project's own footage has NO scoreboard to
  # measure real digit-transition timing/OCR-stability statistics against (unlike sprint/shot/
  # touch/possession/pass, which all cite a real measured distribution from clip2/clip4). Revisit
  # the moment real scoreboard footage (e.g. the in-progress SoccerNet broadcast clip, §3.4) is
  # available to check these against.
  scoreboard_ocr_fps_sample: 1 # whole-take decode cadence for this stage (own budget, matches
  # configs/shots.yaml ocr's own cadence choice for the same reason: a scoreboard digit does not
  # change faster than a human can read it, so 1 fps is ample and cheap).
  candidate_regions: # [x1,y1,x2,y2] as fraction of frame -- a SMALL set, per ADR-17: score bugs
    # are essentially never bottom-corner, so only the two realistic corners are scanned. Tried in
    # this order; `scan_candidate_regions` returns the FIRST one whose reading is measured stable
    # (see min_stable_frames below) -- never a hardcoded assumption that one specific corner is
    # "the" scoreboard for a given source (ADR-11's own lesson: read the measured signal).
    - [0.0, 0.0, 0.25, 0.12] # top-left
    - [0.75, 0.0, 1.0, 0.12] # top-right
  activation_frames_count: 8 # how many of a take's OWN early low-fps samples (at
  # scoreboard_ocr_fps_sample=1, i.e. ~8 seconds of footage) are checked per candidate region for
  # the self-activation test below -- long enough to see several independent reads, short enough
  # to stay "early in the take" per ADR-17's own wording.
  min_stable_frames: 5 # a candidate region "activates" only when the SAME parsed digit-pair
  # reading appears in AT LEAST this many of its activation_frames_count samples -- deliberately a
  # clear MAJORITY (5/8) rather than a bare plurality, since a real scoreboard reads identically
  # frame after frame during a scoreboard-stable early window, whereas a false-positive crop
  # (grass/sky/a sponsor board) reading the same two-digit pattern that often is far less likely.
  increment_debounce_samples: 2 # ADR-17's own debounce rule: a reading increment must hold at the
  # NEW (higher) value for at least this many SUBSequent samples before being trusted as a real
  # goal, not a single-frame OCR misread flickering back down on the next sample.
  occurrence_confidence: 0.75 # ADR-17: the HIGHEST-confidence step in the goal/assist chain (a
  # literal, activated, stable, debounced scoreboard digit transition is strong evidence) --
  # attribution steps below only ever multiply this DOWN, never up (Golden Rule 5: confidence
  # stacks down at each inference step).
  team_unknown_confidence_penalty: 0.5 # applied to occurrence_confidence when NO team-confident
  # possession run exists in the lookback window (team/scorer stay unattributed, player_track_id
  # None) -- still a real goal (worth keeping in the report), just materially less certain who it
  # belongs to.
  scorer_confidence_multiplier: 0.8 # applied on top of occurrence_confidence once a team+scorer
  # ARE determined -- one step down the chain (ADR-17 step 3), never as certain as the occurrence
  # itself since it additionally trusts the possession heuristic's own team-lookup.
  possession_lookback_s: 8.0 # how far back from the observed digit-increment to look for which
  # team held the ball (ADR-17 step 2: "the window immediately before the digit changed").
  # Reasoned, not measured (no real goal footage exists on this project, see block-level note
  # above): long enough to span a short passing buildup at `pass.pass_max_gap_s`=2.0s per pass
  # (covers ~3-4 successive passes), short enough to stay "immediately before", not "at some point
  # earlier in the take".
  max_confidence: 0.8 # HARD CEILING (Golden Rule 5) -- defensive clamp; occurrence_confidence
  # itself already sits under this, kept as an explicit ceiling for consistency with every other
  # category in this file.
  min_confidence: 0.1
  min_ball_confidence_for_goal: 0.5 # ⚠️ REASONED, not measured against a real goal-line crossing
  # (none of this project's own footage has one yet -- see src/events/goal_line.py's own module
  # docstring). A GOAL is the single highest-stakes call this pipeline makes, so it deliberately
  # requires a HIGHER ball-confidence floor than an ordinary touch/pass (touch.min_ball_conf=0.3,
  # possession.min_ball_conf=0.3) -- a low-confidence/likely-interpolated ball position must never
  # be what decides a goal.
  max_crossing_gap_s: 0.3 # the two ball samples straddling the goal-line segment must be this
  # close in time, or the "crossing" is really two unrelated sightings either side of a real gap
  # in ball tracking, not one continuous shot -- deliberately tighter than
  # ball.max_gap_bridge_s=0.5 (Stage 1's own gap-bridging tolerance for ordinary trajectory
  # continuity) since a goal-line crossing specifically must be measured from genuinely
  # consecutive evidence, not evidence bridged across a tracking gap.

assist:
  # ADR-17 step 4 -- owner's own rule, verbatim: "if the target pass the ball and the other score
  # goal should be assist". Credited to the PASSER (src/events/goals.py::find_assist_event).
  assist_window_seconds: 15.0 # how far back from the goal's own end time a qualifying PASS event
  # (src/events/possession.py::detect_passes, evidence["receiver_identity"] == the credited
  # scorer) may have ended and still count as the assist. Reasoned, not measured (same footage
  # ceiling as `goal` above): generous enough to cover a genuine "played the final ball" pass even
  # through a short dribble/touch phase between the pass and the finish, short enough to exclude
  # an unrelated much-earlier pass in the same possession sequence.
  assist_confidence_multiplier: 0.6 # stacks BELOW the goal's own scorer-level confidence (ADR-17:
  # confidence stacks down at each step) -- an assist additionally depends on the pass heuristic's
  # own already-capped confidence (configs/events.yaml: pass.max_confidence=0.35) on top of the
  # goal attribution it is chained to.
  max_confidence: 0.35 # HARD CEILING -- matches `pass.max_confidence` (Golden Rule 5: an assist
  # can never read more certain than the pass heuristic it is built on).
  min_confidence: 0.1
  team_confidence_threshold: 0.5 # "streamed-gathering-treehouse" plan, Stage D bug fix: see
  # `pass.team_confidence_threshold` -- identical value/reasoning, reused here (not re-measured)
  # because `find_assist_event` now re-verifies the passer is a CONFIRMED TEAMMATE of the credited
  # scorer via the same `teammates_gate` tri-state test `pass`/`tackle`/`dribble` already use,
  # closing the gap where the function's own docstring claimed "a teammate pass" but never actually
  # checked it (latent under the default `pass.same_colour_required: true`, but a real gap when
  # that owner-facing escape hatch is set `false` for footage with unreliable colour clustering).

goal_region:
  # ADR-20 (owner, 2026-08-27) -- a SECOND, independent goal-occurrence source alongside `goal`'s
  # scoreboard-OCR delta above, for exactly the footage that has no scoreboard at all (every one
  # of this project's own clips, §3.2(3)): a HUMAN-MARKED goal-mouth polygon per video
  # (`configs/goal_region.yaml`, empty by default -- ADR-3's own human-in-the-loop, no-training
  # pattern, never an auto-detected goal line/net, Golden Rule 2). The ball centroid entering a
  # marked polygon within `shot_window_s` of a real `SHOT` event becomes a `GOAL` candidate.
  #
  # ⚠️ Every default below is REASONED-BUT-UNMEASURED (same epistemic status as `goal`'s own block
  # comment and `save.save_gk_proximity_px`): no clip in this project has a marked goal region yet
  # to measure real ball-crossing/shot-timing statistics against. Revisit the moment the owner
  # actually marks a region on real footage.
  enabled: true # a single kill switch, independent of whether any slug actually has a polygon --
  # set False to disable the whole source globally without editing configs/goal_region.yaml.
  shot_window_s: 3.0 # ADR-20: how long after a SHOT event's own t_end a ball-in-region crossing
  # still counts as that shot finding the net. Reasoned from `pass.pass_max_gap_s`=2.0 (a
  # comparable "how long can two related ball events be apart and still be one continuous
  # sequence" judgement) plus slack for the ball's own flight time from a strike outside the box
  # to the goal mouth -- generous enough to cover a real shot-to-goal-line flight, tight enough to
  # exclude an unrelated later goal-kick/keeper-distribution rolling through the same polygon.
  # Reused as the DEBOUNCE gap too (see `detect_goals_goal_region`): one continuous crossing should
  # not fire once per ~0.03s ball sample.
  confidence: 0.45 # BELOW the scoreboard source's own `goal.occurrence_confidence`=0.75 -- a
  # human-marked region + shot-window heuristic is a real, traceable signal (Golden Rule 5) but a
  # ball merely being inside a hand-drawn polygon after some shot is weaker evidence than literally
  # reading an incremented scoreboard digit. Used directly as both min and max here (a single
  # fixed value, not a formula) since this detector has no further per-event signal to scale by
  # (unlike `goal.occurrence_confidence`, which stacks DOWN through team/scorer attribution this
  # detector doesn't attempt -- ADR-20's own scope note).

confidence:
  min_emit_confidence: 0.15 # ANY event (sprint, shot, or any of the ADR-13/14 heuristics below)
  # scoring below this after its own type-specific formula is dropped outright, not emitted —
  # logged via DropCounter, never silently lowered to make something appear (Golden Rule 5).
  continuity_weight: 0.5 # sprint confidence = continuity_weight * track_continuity +
  # (1 - continuity_weight) * mean_detection_confidence, BEFORE the uncalibrated penalty above —
  # see src/events/sprints.py::_segment_confidence for the exact formula.

# ---------------------------------------------------------------------------------------------
# ADR-13/14 — best-effort touch/pass/tackle/save/dribble/possession heuristics (owner-authorized
# 2026-08-25, CLAUDE.md §13.3). Golden Rule 2 still holds: everything below is ARITHMETIC on top
# of existing Detection/Track/BallDetection artifacts already cached in work/<slug>/ — no training,
# no new pretrained model. Golden Rule 5 still holds harder here than anywhere else in this file:
# each category's own max_confidence is a HARD, deliberately low ceiling (never > 0.5) — these are
# proximity/possession-change proxies, not verified events, and must never read as more certain
# than "worth a human glance".
#
# Coordinate space: every pixel-unit threshold below (touch_distance_px, possession_max_dist,
# pass_max_dist, save_gk_proximity_px) is in the SAME pixel space as the cached
# Detection/Track/BallDetection bbox coordinates already are — i.e. `configs/hardware.yaml:
# stages.detect.image_size`'s decoded/downscaled frame (measured 1920x1080 on both clip2/clip4,
# half native 4K — see `src/detect/detector.py`/`configs/detect.yaml`), NOT raw 3840x2160. This
# matches how sprint/shot already implicitly scale (sprint normalises by bbox-height, shot by
# frame-width, both computed directly off these same cached bbox numbers).
# ---------------------------------------------------------------------------------------------

touch:
  # A "touch" = the ball's centroid comes within `touch_distance_px` of a player's bbox (0px =
  # ball centroid literally inside the box; positive = distance to the box's nearest edge/corner).
  # ⚠️ MEASURED 2026-08-25 on work/clip2_77 + work/clip4_77's own cached ball_detections.parquet /
  # track/tracks.parquet (this task): for every ball detection, the point-to-bbox distance to its
  # nearest non-referee player track (matched within `match_tolerance_s`) was computed directly.
  # clip2 (404 ball samples): the ball's centroid falls INSIDE some player's own box 60.1% of the
  # time (0px); at 40px, 83.9% of samples qualify. clip4 (3332 samples, 4 takes): inside-a-box
  # 27.0% of the time; at 40px, 64.9% qualify (combined across both clips: 66.9%). 40px sits just
  # past the "inside or touching the box" mass on both clips without opening up to "merely
  # somewhere nearby" (55px/70px push combined coverage to 75.5%/79.3% — a materially looser
  # bar) — chosen as the tighter of the two plausible readings since a "touch" should mean
  # contact, and `possession_max_dist` below covers the broader "currently controls the ball"
  # zone. Debounced by `touch_min_gap_s` so continuous proximity (e.g. a stationary dribble) fires
  # one touch every debounce window, not once per ball sample (ball is sampled at
  # `configs/hardware.yaml: stages.ball.fps_sample`=30 i.e. every 0.033s — far faster than a human
  # can actually touch a ball).
  touch_distance_px: 40
  touch_min_gap_s: 0.3 # a fast dribble touches the ball roughly every 0.25-0.5s in reality; below
  # this a "new" touch for the SAME (stitched) identity is almost certainly the same contact
  # re-triggering across consecutive ball samples, not a second genuine touch. Comfortably above
  # both the ball's own 0.033s sampling interval and the track's 0.1s sampling interval
  # (`configs/hardware.yaml: stages.track.fps_sample`=10), so it can't fire from pure frame-to-
  # frame jitter at either rate.
  match_tolerance_s: 0.15 # time-alignment tolerance between a ball sample (30fps) and a track's
  # own box (10fps) — same value/reasoning as `configs/highlights.yaml:
  # selection.arrow_match_tolerance_s` (kept duplicated here rather than cross-imported, per this
  # file's own existing precedent — see the `goal` section's `scoreboard_region_relative`
  # comment — since `configs/events.yaml` stages must stay independently runnable, CLAUDE.md §10).
  min_ball_conf: 0.3 # ignore ball detections below this confidence — identical value/reasoning to
  # `shot.min_ball_conf` above (also softly deweights long interpolated stretches via
  # `configs/detect.yaml: ball_interpolation.interpolated_conf_penalty`).
  contact_window_s: 0.2 # how far before/after a candidate instant `has_contact_evidence`
  # (src/events/touches.py) looks for the ball's own state to compare -- same order of magnitude
  # as match_tolerance_s/touch_min_gap_s above, wide enough to find a real before/after BallState
  # sample at the ball's own ~30fps native rate even after gaps, narrow enough that "before" and
  # "after" cannot straddle two separate real touches.
  min_velocity_change: 2.0 # ⚠️ MEASURED-BUT-NOT-CLEANLY-SEPARATED, 2026-09-02, real data
  # (chelsea_burnley_target10, camera-compensated, 1166 proximity-qualifying candidate instants).
  # No clean bimodal gap was found between "ball merely nearby" and "real contact" in this raw
  # signal -- the delta_v distribution rises continuously (p25=0.94, median=3.43 at
  # ball.smoothing_window_frames=12) rather than showing two separated clusters. 2.0 sits just
  # above the measured median as a REASONED, deliberately strict cut (owner's own stated
  # preference, "accuracy over completeness"): roughly half of proximity-qualifying instants are
  # rejected as `touch_no_contact_evidence` rather than the previous behaviour of accepting ALL of
  # them. This is real signal, not noise alone (a genuine touch changes the ball's velocity vector
  # by definition), but the exact cut point is honestly reasoned, not proven optimal -- revisit
  # the moment hand-labeled real touch instants exist to fit against.
  min_confidence: 0.1
  max_confidence: 0.45 # HARD CEILING (Golden Rule 5): the most directly-grounded heuristic in
  # this file (literal measured pixel proximity), so it gets the highest ceiling of the new
  # categories — still never allowed to read as more than "worth a human glance".

manual_touch:
  # Plan Stage 2 ("streamed-gathering-treehouse", 2026-09-14) -- optional client-typed ball-touch
  # times (src/events/manual_touches.py), submitted alongside the multi-anchor click flow rather
  # than through the ADR-19 sidecar (a click already routes a run to the auto-detect pipeline and
  # explicitly skips the sidecar). Owner's own merge rule: "their times win, auto-detection fills
  # the gaps" -- a typed time is always kept; a same-instant AUTO touch is suppressed, not
  # double-counted.
  time_pattern: '(?:\d{1,2}:)?\d{1,2}:\d{2}' # IDENTICAL value to configs/annotations.yaml:
  # time_pattern (MM:SS or H:MM:SS/HH:MM:SS) -- mirrored, not cross-imported, per this file's own
  # "independently runnable stage configs" convention (see e.g. touch.match_tolerance_s above).
  merge_window_s: 1.0 # ⚠️ REASONED-BUT-UNMEASURED (no real client-typed touch-time data exists yet
  # to measure a genuine "same touch" gap against, same epistemic status as e.g. `goal`'s own
  # block-level comment below): a client transcribing a touch from the video by eye is unlikely to
  # be off by more than about a second from the auto-detector's own contact instant, and this also
  # matches `event_window_seconds` below plus a small slop margin -- a real auto TOUCH within one
  # second of the client's own typed instant is treated as the SAME touch, never a second one.
  event_window_seconds: 1.0 # identical value/reasoning to configs/annotations.yaml:
  # event_window_seconds -- a manual touch time records a single INSTANT the client watched, not a
  # measured [t_start, t_end] interval the way an auto-detector's heuristic produces one.
  confidence: 0.95 # identical value/reasoning to configs/annotations.yaml: default_confidence -- a
  # human directly watching the footage and typing what they saw is the strongest evidence this
  # project has (Golden Rule 4), short of a full 1.0 (an honest, non-zero "transcription-fallible"
  # discount, not a fabricated exact certainty).

possession:
  # For each (confidence-filtered) ball sample, the nearest non-referee player within
  # `possession_max_dist` "has" the ball; consecutive same-identity samples merge into possession
  # INTERVALS (bridging brief `None`/no-one-close-enough gaps under `possession_merge_gap_s`, but
  # NEVER bridging across another identity's own intervening spell — see
  # src/events/possession.py::merge_possession_runs for the exact semantics), then intervals
  # shorter than `possession_min_duration_s` are dropped as noise.
  # ⚠️ MEASURED 2026-08-25 (same pass as `touch` above): 70px sits at the 92.3% mark on clip2's own
  # 404 ball samples and 77.7% on clip4's 3332 (combined 79.3%) — deliberately broader than
  # `touch_distance_px`'s 40px/66.9%, since "currently in this player's playing radius" is a wider
  # zone than "in literal contact this instant".
  possession_max_dist: 70
  possession_min_duration_s: 0.3 # matches `shot.min_duration_s`'s own reasoning ("a real strike's
  # fast phase is brief") applied to the opposite case: a single-sample proximity blip is noise,
  # but a real possession spell need not be long to count.
  possession_merge_gap_s: 0.5 # matches `sprint.sprint_merge_gap_s`'s reasoning: a brief ball-
  # tracking miss/occlusion mid-possession (SAHI gap, `configs/detect.yaml:
  # ball_interpolation.max_gap_frames`) shouldn't split one real spell into two.
  match_tolerance_s: 0.15 # see `touch.match_tolerance_s` — identical reasoning, duplicated per
  # this file's own independently-runnable-stages convention.
  min_ball_conf: 0.3 # see `touch.min_ball_conf`.
  continuity_weight: 0.5 # possession confidence blends CONTINUITY (fraction of the interval's
  # expected 30fps ball samples actually present) and mean proximity CLOSENESS the same way
  # `sprint`'s `confidence.continuity_weight` blends continuity and detection confidence — see
  # src/events/possession.py::possession_confidence.
  min_confidence: 0.1
  max_confidence: 0.4 # HARD CEILING — one step below `touch`'s, since a possession INTERVAL
  # chains several ball samples' worth of nearest-player lookups together (more surface area for
  # the heuristic to be wrong than a single touch instant).

pass:
  # A pass = a possession interval by player A ends, and a TEAMMATE B's possession interval begins
  # within `pass_max_gap_s`/`pass_max_dist`, with no other identity's possession interval in
  # between (guaranteed by construction — see src/events/possession.py: adjacency is checked on
  # the full, pre-min-duration-filtered interval list, so even a real but brief opposing touch
  # in between correctly blocks a pass being inferred straight through it).
  # ⚠️ MEASURED 2026-08-25 on work/clip2_77 + work/clip4_77's tracks.parquet: pairwise distances
  # between every pair of simultaneously-visible non-referee players, per take. Combined p75
  # across clip2's one take and clip4's four takes ranges 662-769px, p90 826-1040px, max
  # 1647-1855px (frame is ~1920px wide at this stage's coordinate space). `pass_max_dist` is set
  # at the upper edge of the "typical spacing" band (p75-ish) rather than the p90+ tail — a
  # possession change at p90+ distance reads more like an unrelated separate event (or a
  # long-ball/clearance `shot` candidate) than one continuous passing sequence.
  pass_max_dist: 750
  pass_min_gap_s: 1.0 # ⚠️ REASONED, not measured against hand-labeled real pass sequences --
  # same epistemic status as several other thresholds in this file. Real bug this closes,
  # measured 2026-09-02 on clip1_43: adjacent possession-run pairs fired 9 PASS events in an 11s
  # clip, 0.1-0.4s apart, all at IDENTICAL confidence (0.35) -- runs fragment easily
  # (possession.possession_min_duration_s=0.3s) with nothing stopping the SAME passer being
  # credited twice a fraction of a second apart. Compared in real SECONDS against run end
  # timestamps (FPS-independent by construction, same as touch.touch_min_gap_s). 1.0s is a
  # deliberately strict floor -- the shortest plausible real gap between two GENUINELY separate
  # passes by the same player (ball leaves, reaches a teammate, comes back around) -- per the
  # owner's own stated preference for pass counting ("strict -- fewer, high-confidence").
  pass_min_flight_s: 0.25 # Owner-reported 2026-09-16: "for 1 pass it counts 5". ⚠️ MEASURED
  # root cause on clip5_77 (14s take): the detector emitted 25 PASS events across ALL players
  # -- nearly two per second -- and every one of the 5 attributed to the target had the ball "in
  # flight" (passer's run END -> receiver's run START) for only 0.03-0.10s, i.e. ONE TO THREE FRAMES
  # at 30fps; across all 25 the median gap was exactly 0.033s (one frame) and the MAX was 0.20s.
  # A kicked ball is out of anyone's possession for the whole time it travels; a gap of one frame
  # is physically possible only if the two players are touching -- it is the possession heuristic
  # flickering between adjacent players, not a pass. The pre-existing gate only capped the gap
  # from ABOVE (`pass_max_gap_s`); it had no floor, so single-frame handoffs passed straight
  # through. This floor sits above every false positive measured (all <= 0.20s) while permitting
  # a genuinely short lay-off (~7-8 frames; a ball at even 5 m/s covers ~1.25m in this time, so it
  # cannot exclude a real pass between two players who are not physically touching). Compared in
  # real seconds against run timestamps -- FPS-independent, same as `pass_min_gap_s` below.
  # ⚠️ REASONED against the measured false-positive distribution, NOT validated against
  # hand-labeled real pass sequences -- consistent with the owner's stated preference for pass
  # counting ("strict -- fewer, high-confidence") and Golden Rule 5 (unknown beats false).
  pass_min_travel_px: 60 # ⚠️ REASONED -- same px unit and coordinate space as `pass_max_dist`
  # above (kept in px, not bbox-heights, purely so the two bounds on ONE quantity share a unit).
  # Companion floor to `pass_min_flight_s`: one measured false positive on clip5_77 (t=10.87)
  # moved the ball only 38px in a single frame -- ball-detection jitter, not travel. 60px is well
  # under any player's own width at this stage's ~1920px-wide coordinate space (`pass_max_dist`'s
  # own measured p75 player spacing is 662-769px), so a real pass to a teammate standing even
  # arm's-length away clears it comfortably; only a ball that did not actually go anywhere fails.
  pass_max_gap_s: 2.0 # generous enough for the ball to travel `pass_max_dist` in flight without
  # anyone else registering as "in possession" in between, informally calibrated the same way
  # `shot.ball_speed_threshold` is (no direct ball-flight-time measurement on this footage,
  # deliberately conservative) — short enough to exclude a slow, unrelated build-up that only
  # coincidentally ends at a teammate.
  team_confidence_threshold: 0.5 # gates "is B a TEAMMATE of A" on BOTH possessors' own
  # `team_confidence` clearing this bar (ADR-12: team is a soft signal, ⚠️ see below) — same VALUE
  # as `configs/highlights.yaml: selection.team_match_confidence_threshold`, kept independently
  # duplicated (not cross-imported) per this file's own convention, chosen because it is measured
  # to matter here just as much: on clip2, EVERY ONE of its 47 tracks has `team_confidence <= 0.3`
  # (ADR-12's own documented degenerate-split take) — a pass heuristic gated at 0.5 therefore
  # emits ZERO pass events on clip2, which is the CORRECT, honest behaviour (Golden Rule 5: no
  # team signal worth trusting there), not a bug. On clip4, 506/666 (76%) tracks clear 0.5.
  min_confidence: 0.1
  max_confidence: 0.35 # HARD CEILING — below `possession`'s, since a pass additionally depends on
  # the (soft, ADR-12) team signal on top of two chained possession-interval lookups.
  same_colour_required: true # ADR-20 (owner, 2026-08-27): a completed PASS strictly requires the
  # receiver to be the SAME ADR-12 colour cluster as the passer — the owner's own restated rule
  # ("pass to the same jersey colour is a completed pass; to the other side is not"). This is an
  # owner-facing escape hatch, not a tuned threshold: set False only if a specific video's own
  # colour clustering turns out to be unreliable and you'd rather fall back to the pre-ADR-20
  # behaviour (every possession change counted as a pass) than get spurious turnovers — none of
  # this project's own clips need that today.

turnover:
  # ADR-20 (owner, 2026-08-27): the possession-change-to-a-DIFFERENT-colour-cluster case
  # `detect_passes` used to drop as `"pass_not_teammates"` — now a real, traceable `EventType.
  # TURNOVER` (Golden Rule 5: a lost ball is not "nothing happened", and hiding it would be a
  # silent, dishonest filter; the owner's own words: "the other side is not a completed pass",
  # i.e. still an event, just not that one). Reuses `pass.pass_max_dist`/`pass_max_gap_s`'s own
  # adjacency eligibility (`turnover_confidence` shares `pass_confidence`'s exact closeness-by-
  # travel shape) — the only thing that differs between a pass and a turnover is which colour
  # cluster ended up with the ball, not how far/fast it moved.
  enabled: true # a single kill switch for the whole category, independent of `same_colour_required`
  # above (that flag changes whether an opposing-colour change is EVER distinguished from a pass at
  # all; this flag changes whether a distinguished one gets emitted as an event or just dropped).
  min_confidence: 0.1
  max_confidence: 0.35 # HARD CEILING — same tier as `pass` (identical confidence-chain depth: one
  # possession-change instant, two chained possession-interval qualities, one soft ADR-12 team
  # check) — a turnover is not inherently less certain than a pass would have been, it just landed
  # on the other colour.
  suppress_if_tackle_within_s: 0.5 # ADR-20: `detect_tackles` (src/events/tackles.py) already
  # detects the identical "possession changes to a confidently OPPOSING identity" transition, with
  # its own additional closing-speed precondition — when BOTH fire for the same transition
  # (`src/events/aggregate.py::suppress_turnovers_covered_by_tackles`: same take, tackler/tackled
  # raw track ids match the turnover's own receiving/losing raw track ids, and the two events' own
  # `t_end` sit within this many seconds of each other), the TURNOVER is suppressed — logged via
  # DropCounter, never silently vanished — so one real dispossession is never double-counted as
  # both a Tackle and a Turnover on the same player's stat card. 0.5s is a generous window given
  # both events are keyed off the SAME `run_b.t_start` instant in the common case (they consume
  # the identical `possession_runs_for_take` adjacency) — real floating-point/pipeline-order drift
  # between the two computations should be well under a frame's worth of time, so this is not a
  # tuned "how long a tackle takes" threshold, just slack for the two detectors' own bookkeeping.

dribble:
  # A single possession interval by ONE identity, long enough (`dribble_min_duration_s`) with an
  # opponent within `dribble_contest_dist` for at least part of it (pressure) AND the possessor's
  # own position moving at least `dribble_min_travel` over the interval (rules out "standing still
  # with the ball loosely nearby"). Distances here are in BBOX-HEIGHTS, the same normalised unit
  # `sprint`/`configs/highlights.yaml: selection.stitch_max_dist` already use — NOT the raw-pixel
  # unit `touch`/`possession` use above, since "how close is a marker" and "how far did the
  # dribbler travel" both scale with the player's own apparent size the same way sprint speed does
  # (ADR-6's own justification for that unit applies identically here).
  dribble_min_duration_s: 1.0 # reuses `sprint.sprint_min_duration_s`'s exact reasoning: a fast
  # 1-2 stride touch-and-release is not "a dribble", a spell sustained for a full second is.
  dribble_contest_dist: 2.0 # tighter than `configs/highlights.yaml:
  # selection.stitch_max_dist`=3.0 (that value is a reacquisition SLOP bound for "might be the
  # same person", deliberately loose) — genuine marking/pressure from an opponent should read as
  # closer than that, so 2.0 is chosen strictly below it.
  dribble_min_travel: 1.0 # roughly one body-length of net displacement over the interval — enough
  # to exclude standing still while the ball merely sits near a stationary player's feet.
  team_confidence_threshold: 0.5 # see `pass.team_confidence_threshold` — identical value/
  # reasoning, gates "is the nearby player actually an OPPONENT" the same way.
  min_confidence: 0.1
  max_confidence: 0.35 # HARD CEILING — same tier as `pass` (also chains a possession-interval
  # lookup plus a soft team-opposition check).

tackle:
  # A tackle candidate = possession changes from identity A to an OPPOSING-team identity B
  # (`team_confidence_threshold`-gated, reusing `pass`'s exact value/reasoning) within
  # `tackle_max_duration_s`, where B was measurably CLOSING distance on A/the ball beforehand
  # (`tackle_min_closing_speed`, looking back up to `tackle_lookback_s`). Attribution: emitted
  # `player_track_id` is the TACKLER (B) — matches the conventional football-stats reading of
  # "Tackles: N" on a player's own card (CLAUDE.md §13.2) as tackles THEY made, not tackles they
  # suffered. `Event.evidence` additionally carries both `tackler_identity`/`tackled_identity` so
  # a future consumer could derive "times dispossessed" from the same event stream without
  # re-running the heuristic (Golden Rule 5 traceability).
  tackle_max_duration_s: 1.5 # a genuine dispossession is fast — a possession change taking longer
  # than this reads as an unrelated later event, not one continuous challenge.
  tackle_lookback_s: 1.0 # how far back from the possession-change instant to sample B's own
  # position for the closing-speed check — long enough to see a real closing run, short enough to
  # stay "just before this specific challenge" rather than B's whole prior trajectory.
  tackle_min_closing_speed: 1.0 # bbox-heights/second — reuses `sprint.sprint_speed_threshold`'s
  # own measured justification verbatim (CLAUDE.md task: "notably faster than typical movement,
  # not exceptional" on this exact footage's measured speed distribution): closing in at least
  # sprint-speed is what distinguishes a real challenge from B merely being nearby already.
  team_confidence_threshold: 0.5 # see `pass.team_confidence_threshold`.
  min_confidence: 0.1
  max_confidence: 0.3 # HARD CEILING — lowest of the possession-chain heuristics: a tackle chains
  # TWO possession intervals, a soft team-opposition check, AND a closing-speed proxy with no
  # actual contact/challenge detection at all.

save:
  # Structurally the WEAKEST heuristic in this file (see src/events/saves.py module docstring): no
  # goal-position model or pitch homography exists on this footage (ADR-3), so "near the
  # goalkeeper" is only ever "near whatever bbox a GOALKEEPER-class track happens to have" — no
  # notion of "the goal line" at all. Only evaluated for takes containing a track with
  # `dominant_class == GOALKEEPER`; a take with none simply produces zero save events (not forced).
  # ⚠️ NOT GROUNDED in this project's own measured data the way every other section above is:
  # neither work/clip2_77 nor work/clip4_77 contains a single GOALKEEPER-class track (checked
  # 2026-08-25, this task) — there is no real footage to calibrate `save_gk_proximity_px` against.
  # It is set at the same ORDER OF MAGNITUDE as `possession_max_dist`/`pass_max_dist` (this stage's
  # own pixel coordinate space) as an honest placeholder, not a measured value — flagged here so it
  # is revisited the moment footage with a keeper exists.
  smoothing_window_frames: 3 # identical value/reasoning to `shot.smoothing_window_frames` — same
  # underlying ball-speed series (`src/events/shots.py::ball_speed_series`, reused not
  # reimplemented).
  ball_speed_threshold: 0.12 # frame-widths/second — identical value/reasoning to
  # `shot.ball_speed_threshold` (same underlying signal: "the ball is moving fast").
  min_duration_s: 0.3 # identical value/reasoning to `shot.min_duration_s` — the fast-approach
  # phase this looks for is, like a shot, brief by nature.
  merge_gap_s: 0.3 # identical value/reasoning to `shot.merge_gap_s`.
  save_gk_proximity_px: 300 # ⚠️ UNGROUNDED placeholder, see above.
  save_max_window_s: 1.0 # the deceleration/reversal must follow the fast approach quickly to read
  # as one continuous save event, not two unrelated ball movements.
  save_deceleration_ratio: 0.3 # "sharp deceleration" = the ball's peak speed in the window AFTER
  # the fast approach drops to at most this fraction of the peak speed BEFORE it (a save either
  # decelerates the ball sharply OR reverses its net horizontal direction — see
  # src/events/saves.py::detect_saves — either condition alone qualifies).
  min_ball_conf: 0.3 # see `touch.min_ball_conf`.
  min_confidence: 0.1
  max_confidence: 0.2 # HARD CEILING, deliberately the LOWEST of every category in this file —
  # this heuristic has no goal-position awareness, no contact detection, and (per the note above)
  # zero real footage to have ever been checked against. Never allowed to read as anything beyond
  # "flag for a human to look at", and expect it to be the noisiest category by far.
