# Hardware + compute-budget configuration (CLAUDE.md §11).
# Single machine: NVIDIA RTX A2000 12 GB (Ampere). LOCAL ONLY — no paid cloud (CLAUDE.md §11).

device: cuda # "cuda" or "cpu"; pipeline falls back to cpu automatically if no GPU is visible
precision: fp16 # mixed precision everywhere (CLAUDE.md §11 fit-in-12GB rules)

# VRAM budget the pipeline targets per stage. CLAUDE.md §11.1 measured an unrelated process
# (Downloads/Ad Blocker/.venv) holding 6.0 GB at scaffold time, leaving ~5.2 GB free — so the
# default budget below is conservative (5 GB), not the full 12 GB card.
vram_budget_mb: 10000 # raised 5000 -> 10000 on 2026-08-24: the contending process (PID 10393,
# Downloads/Ad Blocker) exited, freeing the card (11481 MiB free measured). If another
# process reclaims VRAM, drop this back to ~5000 and the preflight will warn accordingly.
vram_total_mb: 12282 # measured total VRAM of the RTX A2000 12 GB (CLAUDE.md §11.1)
preflight_warn: true # warn (not fail) when free VRAM < stage budget before a stage starts

decode:
  scale_width: 1920 # downscale 4K input before detection (CLAUDE.md §3.1) — never feed 4K raw to a detector
  chunk_seconds: 180 # process the match in fixed chunks so long runs are resumable (CLAUDE.md §11)

# Per-stage compute knobs. `fps_sample` = frames sampled per second of source video for that
# stage (CLAUDE.md §11 "per-stage fps sampling defaults"); `batch_size`/`image_size` bound VRAM.
stages:
  ingest:
    fps_sample: 30 # ingest decodes at native fps; downstream stages subsample further

  profile:
    fps_sample: 2 # source profiler: cuts/motion only need a sparse sample

  shots:
    fps_sample: 2 # shot-boundary/replay detection: 1-2 fps per CLAUDE.md §11

  detect:
    batch_size: 2
    image_size: 1280
    fps_sample: 25 # RAISED from 10, 2026-09-01, owner-authorized ("no matter how much it
    # computationally expensive i want good results") to attack ID switches at their source.
    # MEASURED cause: the owner clicked the real #10 (raw track 1, reads "10" 8/10) and the target
    # box later moved to a different player. The clicked player's own selected chain was NINE
    # fragments over 37.7s -- every one of those 8 joins is a chance for `stitch_timeline` to pick
    # the wrong same-kit teammate, and two joined fragments (64, 154) are not players at all
    # (empty-grass boxes). ByteTrack here is motion/IoU-only with NO appearance model
    # (`supervision` 0.30), so its ONLY defence against a swap is that boxes overlap enough
    # between consecutive samples. At 10 fps on 25 fps footage that is a 100ms gap; at 25 fps it
    # is 40ms, so inter-frame displacement drops ~2.5x, association gets much easier, tracks
    # fragment less, and there are simply fewer risky stitch joins to get wrong.
    # ⚠️ MUST stay in sync with `configs/track.yaml: bytetrack.frame_rate` (the Kalman motion
    # model's own timebase) AND with `lost_track_buffer`, which is counted in FRAMES -- raising
    # fps without scaling that buffer would SHORTEN its wall-clock tolerance and make
    # fragmentation worse, not better. Both were updated together.
    # Cost: detection is ~2.5x slower (measured ~3 min -> expect ~7-8 min for this 70s clip).

  ball:
    batch_size: 1
    image_size: 1280
    fps_sample: 30 # ball needs full-fps sampling where it matters (CLAUDE.md §11)
    sahi:
      tile_size: 640 # SAHI tiling for small-object (ball) detection
      overlap_ratio: 0.2

  pitch:
    fps_sample: 1 # one calibration per take for static cams (ADR-3); sparse otherwise

  track:
    fps_sample: 25 # matches detect.fps_sample; tracker consumes the detector's output

  team:
    batch_size: 8
    image_size: 224
    fps_sample: 2 # team/jersey: 1-2 fps per tracklet (CLAUDE.md §11)

  ocr:
    fps_sample: 1 # Phase-2 jersey OCR; scoreboard OCR uses the same cadence
