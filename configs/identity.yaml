# Stage 5.5 (ADR-15, CLAUDE.md §3.3/§5.1) — verified jersey-number identification for
# filename-less input. Only ever runs when `target_jersey is None` (no `clip<N> <jersey>.mp4`
# filename metadata) — never for the original 5 clips, whose Phase-1 human-selects-the-track flow
# is untouched (CLAUDE.md §12 Don'ts). This is a narrow, owner-authorized pull-forward of a slice
# of Phase 2 (jersey OCR) — never guesses a number from appearance/position/team/the arrow alone;
# a number counts only when read from visible evidence with temporal agreement across multiple
# independent frames (Golden Rule 5).

crop:
  # A box shorter than this cannot possibly carry a legible 1-2 digit jersey number. Originally
  # (through 2026-08-27) this was a hardcoded ABSOLUTE pixel count, `min_crop_height_px: 120`,
  # calibrated only against this project's own native-4K (3840x2160) footage (§3.2's "jerseys
  # legible at 4K for mid/near players... even at 1280px" finding, extrapolated to native 4K: a
  # jersey number glyph is roughly 12-18% of a player's own bbox height, EasyOCR's own practical
  # minimum reliable text height is ~15-20px, so a box needs to be tall enough that ~15% of it
  # clears ~20px, i.e. at least ~135px tall at native 4K -- 120px set with a small margin below
  # that). That absolute constant does NOT generalize: measured 2026-08-31 on real 720p broadcast
  # footage (`input/video2`/`video3`, `chelsea_burnley_target10`/`target2`, same underlying match)
  # mean player bbox height is 71.9px, median 70.7px -- only 0.63% of boxes ever cleared a fixed
  # 120px gate, silently starving Stage 5.5/ADR-19's re-identification signal on any non-4K input.
  # FIX (this stage, ADR-plan "streamed-gathering-treehouse" Stage A): express the gate as a
  # FRACTION of the DECODE-FRAME height instead, so it scales with whatever resolution a video is
  # actually decoded at. The fraction is the original 4K calibration re-derived: 120px / 2160px
  # native height = 0.05556 (~5.56% of frame height). Cross-checked against the 720p measurement:
  # 0.05556 * 720px = 40.0px -- comfortably below the measured 71.9px mean/70.7px median box
  # height (so the large majority of real 720p player boxes now clear the gate, unlike the old
  # 0.63%), while still meaningfully above zero (not a no-op permissive gate) and unchanged in
  # absolute terms for the native-4K case that originally justified it (0.05556 * 2160 = 120.0px,
  # exact). Honest caveat, documented rather than hidden: the underlying "12-18% of bbox is the
  # glyph" ratio was measured on THIS project's own Veo footage, not on broadcast video generally
  # -- reusing the same relative fraction across resolutions is the safest available
  # generalization (scales correctly, changes nothing for the already-verified 4K case) but has
  # not itself been re-derived from a fresh ratio measurement on 720p broadcast footage; revisit
  # if 720p verification/re-acquisition rates suggest the fraction is still mis-calibrated.
  min_crop_height_frac: 0.05556
  identity_fps_sample: 2 # native-res decode cadence for THIS stage only (a separate budget from
  # configs/hardware.yaml stages.team.fps_sample=2, which decodes at Stage 2's DOWNSCALED
  # resolution) — CLAUDE.md §11 "team/jersey: 1-2 fps per tracklet" budget, at the higher end
  # since native-4K frames are expensive to decode/hold even briefly.
  torso_crop_expand: 0.08 # expand the candidate track's own bbox by this fraction on each side
  # before cropping, so a jersey number sitting near the box edge (loose bbox, motion blur) isn't
  # clipped off.

ocr:
  engine: easyocr # Apache-2.0 (CLAUDE.md §7), `ocr` extra
  gpu: true
  min_easyocr_confidence: 0.4 # EasyOCR's own per-result confidence; below this a read is treated
  # as "ambiguous" (escalation-eligible to the VLM), never as a confident digit read on its own.
  max_digits: 2 # a soccer jersey number is 1-2 digits; a 3+ digit "read" is almost certainly OCR
  # noise (a sponsor logo, a background number/scoreboard-like graphic) and is discarded outright,
  # never escalated to the VLM as if it were a plausible candidate.

vlm:
  provider: gemini
  # ⚠️ ORDERED FALLBACK LIST (added 2026-08-27, ADR-15), not a single model: `gemini-3.6-flash`
  # (ADR-15's original choice, since gemini-2.5-flash 404s "no longer available to new users")
  # turned out to carry a hard 20-REQUESTS-PER-DAY free-tier quota
  # (quotaId="GenerateRequestsPerDayPerProjectPerModel-FreeTier") -- confirmed by direct API probe
  # after a real run exhausted it partway through take 6 of 14, silently turning every later
  # take's identity check into a false "unverified" (the crops were never actually looked at).
  # `gemini-flash-lite-latest` and `gemini-3.1-flash-lite` were confirmed reachable with separate,
  # unexhausted quota on the same key/day; `gemini-2.5-flash-lite`/`gemini-2.5-pro` are 404
  # ("no longer available to new users"); `gemini-pro-latest` was ALSO exhausted. Tried in order;
  # `src/common/gemini.py::call_gemini_vision` moves to the next model on a 429 whose body's
  # `error.status` is `RESOURCE_EXHAUSTED` (daily quota -- retrying the same model is pointless
  # until it resets) or any non-retryable HTTP error, and still retries-with-backoff on the SAME
  # model for a transient 429/5xx first.
  models:
    - gemini-flash-lite-latest
    - gemini-3.1-flash-lite
    - gemini-3.6-flash
  api_url_template: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
  timeout_s: 30
  max_retries: 3
  retry_backoff_base_s: 2.0 # exponential backoff (2s, 4s, 8s) — covers the transient 503
  # "UNAVAILABLE" measured 2026-08-27 (ADR-15) plus ordinary network hiccups.
  temperature: 0.0
  jpeg_quality: 90
  max_escalations_per_take: 6 # cost/latency control, mirrors ADR-14's own "cheap pre-filter, VLM
  # only on survivors" pattern: at most this many OCR-ambiguous-or-silent crops per take are ever
  # sent to Gemini. A take needing more than 6 VLM calls to resolve is ambiguous enough that a 7th
  # call is unlikely to change the outcome — stays unverified rather than escalating indefinitely.

aggregation:
  min_agreeing_frames: 2 # ADR-15 / owner's explicit rule: never declare a jersey number
  # "verified" off a single frame's read. At least this many INDEPENDENT frames (OCR and/or VLM,
  # any mix of sources) must read the SAME digit string before a take counts as verified.
  min_verified_confidence: 0.3 # a verified take's OWN computed confidence (agreement fraction *
  # mean source confidence, see src/identity/verify.py::aggregate_take_identity) must still clear
  # this floor — a bare 2-agreeing-frames-out-of-40-read-attempts result is technically "temporal
  # agreement" but not something to present as reliable identification.
