# ADR-19 (CLAUDE.md §14.3) — manual-annotation sidecar parser config. Owner-authorized recovery
# path for footage too poor for ADR-15's OCR/VLM identity verification (§3.3 measured 0/14): the
# client watches the video and supplies a short text file of timestamped events in their own
# natural phrasing. This file holds the grammar's tunables — the parser (src/annotations/parse.py)
# hard-codes no phrase strings or confidence numbers (CLAUDE.md §10 "no magic numbers in code").

default_confidence: 0.95 # CLAUDE.md §14.3/ADR-19: a human directly watching the footage and
# transcribing what they saw is the strongest identity/event evidence this project has (Golden
# Rule 4) — higher than any auto heuristic's own ceiling in configs/events.yaml (all <= 0.8) — but
# not a full 1.0, since a human transcript can still contain typos/misremembered timestamps
# (an honest, non-zero "transcription-fallible" discount, not a fabricated exact certainty).

time_prefixes:
  # Optional literal prefix stripped before parsing the time field itself — the client's own
  # example phrasing ("Min 26:56 ...") uses this; the prefix is OPTIONAL in the grammar (a bare
  # "26:56 player #2 ..." must also parse) so a client who drops the "Min " label isn't rejected.
  - "Min "

time_pattern: '(?:\d{1,2}:)?\d{1,2}:\d{2}' # MM:SS or H:MM:SS/HH:MM:SS, converted to a float
# seconds-from-video-start offset (src/annotations/parse.py::_parse_time). Deliberately permissive
# on hour-digit count (1 or 2) since a client is very unlikely to annotate a 100+ hour clip.

# Grammar extension 2026-08-31 (CLAUDE.md §14.3): real client phrasing (input/video1/instruction)
# uses an em-dash between the time and the rest of the line ("Min 0:15 — Player ...") instead of a
# plain space. A plain space is always accepted regardless of this list (src/annotations/
# parse.py::_strip_separator lstrips first); this is only the extra literal separators beyond
# that. Checked longest-first by the parser itself, not by this list's own ordering.
line_separators:
  - "—" # em-dash
  - "-" # plain hyphen (kept distinct from "—" since some editors/clients use ASCII "-" instead)
  - ":" # colon, e.g. a hypothetical "Min 0:15: Player ..."

unspecified_colour: "unspecified" # CLAUDE.md §14.3 grammar extension 2026-08-31: the colour
# clause ("in <colour>") is OPTIONAL -- a real client line can name no colour at all
# ("Player #11 scores goal", input/video1/instruction). `Annotation.team_colour` is a required
# `str` field (src/common/types.py), so this sentinel records "no colour was given" without
# fabricating one. Deliberately NOT a key in `colour_reference_lab` below, so Stage 4's
# `nearest_track_by_colour` (src/annotations/associate.py) can never spuriously resolve it to a
# real reference colour -- it correctly falls through to `(None, None)`, the same honest
# "no confident colour match" result as any other unknown colour word (Golden Rule 5).

# Ordered phrase -> EventType map (CLAUDE.md §14.3's "starter map"), checked TOP TO BOTTOM against
# the lower-cased action-phrase text via substring containment — order matters where one phrase is
# a substring of another's plausible phrasing (e.g. "out of bounds" must be checked as its own
# entry, not accidentally swallowed by a looser later pattern). The FIRST matching entry wins; an
# action phrase matching none of them becomes `unmapped_event_type` below (never dropped, §10).
phrase_map:
  - patterns: ["touch"]
    event_type: TOUCH
  - patterns: ["out of bounds", "out of play"]
    event_type: OUT_OF_BOUNDS
  - patterns: ["pass"]
    event_type: PASS
  - patterns: ["shot", "shoots", "shoot"]
    event_type: SHOT
  - patterns: ["goal", "scores", "score"]
    event_type: GOAL
  - patterns: ["assist"]
    event_type: ASSIST
  - patterns: ["tackle"]
    event_type: TACKLE
  - patterns: ["save"]
    event_type: SAVE
  - patterns: ["sprint", "run"]
    event_type: SPRINT
  - patterns: ["dribble"]
    event_type: DRIBBLE
  - patterns: ["celebrat"] # CLAUDE.md §14.3: deliberately maps to KEY_MOMENT, not a new
    # CELEBRATION EventType — src/pipeline/player_output.py::_key_moment_label already renders a
    # KEY_MOMENT as "Celebration" in the timeline by reading Gemini's own reasoning text (ADR-14);
    # extended here to also read an Annotation's own `action_phrase` for the identical text, so
    # both routes to the same timeline label share one representation instead of two.
    event_type: KEY_MOMENT

unmapped_event_type: KEY_MOMENT # CLAUDE.md §14.3: a phrase matching none of the entries above is
# never dropped -- kept as a KEY_MOMENT event with the raw phrase preserved in evidence, and
# reported in annotation_report.json (§10 "log everything dropped" -- an unmapped phrase isn't
# "dropped" exactly, but it is a case the parser couldn't confidently classify, same spirit).

# ---------------------------------------------------------------------------------------------
# Stage 4 -- manual-mode track association by colour + timing (src/annotations/associate.py).
# Reuses src/team/classifier.py's existing torso-crop + CIELAB machinery verbatim (Golden Rule:
# no new model). This module adds the one step ADR-12's own per-take clustering never needed:
# matching a colour WORD (the client's own "in white"/"in red"/...) to a measured Lab value.
# ---------------------------------------------------------------------------------------------

colour_reference_lab:
  # ⚠️ REASONED-BUT-UNMEASURED, except `blue` below (measured 2026-08-31, see its own comment):
  # these remaining entries carry the same epistemic status as `goal_region.confidence`/
  # `save.save_gk_proximity_px` in configs/events.yaml -- standard CIELAB (D65) conversions of
  # canonical sRGB primary/secondary/named colours, a reasonable STARTING reference, not a promise
  # that any given kit's exact shade matches these numbers. `blue`'s own real measurement (below)
  # shows this gap can be large: a real broadcast jersey reads far less saturated than an idealized
  # colour-chip swatch (compression, lighting, motion blur, torso-crop background bleed) -- so
  # treat every OTHER entry here as similarly optimistic until it, too, gets a real measurement.
  # Revisit each one the moment real footage naming that colour exists (same "revisit when real
  # data exists" discipline as those two other config blocks).
  white: [100.0, 0.0, 0.0]
  black: [0.0, 0.0, 0.0] # ⚠️ a real (if single, noisy) data point suggests this one is ALSO badly
  # off: a referee track in `chelsea_burnley_target10` (t=57.0s, track 187 -- visually confirmed
  # black kit) measured (post opencv_lab_to_cielab fix) [51.56, -10.25, 12.18], not near [0,0,0] --
  # but this is ONE crop, possibly contaminated by grass/background bleed into the torso region
  # (CLAUDE.md §3.2's own documented failure mode), so it is NOT corrected here (that would be
  # guessing from n=1) -- flagged as a known follow-up, not fixed, per the same "don't guess"
  # discipline as everything else in this file.
  grey: [53.59, 0.0, 0.0]
  gray: [53.59, 0.0, 0.0] # US spelling alias -- the client's own wording is not policed
  red: [53.24, 80.09, 67.20]
  maroon: [25.53, 48.05, 38.06]
  orange: [74.94, 23.93, 78.95]
  yellow: [97.14, -21.55, 94.48]
  green: [87.73, -86.18, 83.18]
  blue: [52.76, -2.70, -3.38] # ⚠️ CORRECTED 2026-08-31, MEASURED (bug fix, see
  # src/annotations/associate.py::opencv_lab_to_cielab's own docstring for the underlying unit bug
  # this replaces). Real data: `chelsea_burnley_target10` (video2), t=57.0s, `work/
  # chelsea_burnley_target10/track/tracks.parquet` -- 6 candidate tracks near that instant were
  # visually confirmed as genuine Chelsea-blue kit (track ids 188/208/210/215/219/221, cross-
  # checked against cropped frame images, not guessed from Lab values alone); this is the MEDIAN
  # of their own per-track median-of-crops true CIELAB (after the opencv_lab_to_cielab fix). The
  # previous value [32.30, 79.19, -107.86] was an idealized pure-sRGB-blue colour chip -- 130+
  # units away from this real measurement, which is exactly why colour association was silently
  # failing on every blue-named annotation before this fix. See `colour_match_max_distance` below
  # for the corroborating cross-check against real non-blue (claret/maroon) tracks in the same
  # frame.
  navy: [12.97, 47.53, -64.70]
  sky: [91.11, -48.09, -14.13]
  cyan: [91.11, -48.09, -14.13]
  purple: [29.78, 58.93, -36.49]
  pink: [60.32, 98.23, -60.83]
  light blue: [83.92, -11.0, -11.0] # added 2026-08-31 for real client phrasing (§3.5/video1)
  # that names two-word colours; same "canonical sRGB -> OpenCV CIELAB" derivation as every other
  # entry in this table (sRGB ~(173,216,230), a standard "light blue"/powder-blue reference).
  # ⚠️ Given `blue`'s own measured correction above, treat this one as similarly optimistic until
  # real light-blue-kit footage exists to check it against.
  dark green: [36.08, -43.0, 42.0] # same derivation, sRGB ~(0,100,0), a standard "dark green".
  # Same caveat as `light blue` above -- unmeasured against real footage.

colour_match_max_distance: 8.0 # ⚠️ CORRECTED 2026-08-31, MEASURED (was 40.0, reasoned-but-
# unmeasured -- see git history for that value's original "half the smallest gap between two
# reference colours" reasoning, now superseded). Real data, same instant as `blue`'s own
# measurement above (`chelsea_burnley_target10`, t=57.0s): of the 6 confirmed-blue tracks, 4 sit
# within 1.25-4.16 units of the corrected `blue` reference; the OTHER 8 candidate tracks at that
# instant, visually confirmed as the opposing team's claret/maroon kit (NOT blue), sit no closer
# than 12.1 units away. 40.0 (or even the old idealized `blue` reference's own ~130-unit gap) would
# have let every one of those maroon tracks pass as a confident "blue" match -- a real, measured
# false-positive risk, not a hypothetical one. 8.0 sits with a safety margin below that measured
# 12.1 floor: it reliably keeps out every real non-blue track observed so far, at the honest cost
# of missing 2 of the 6 blue tracks whose crops were more motion-blurred/occluded (13.0 and 16.4
# units away) -- an acceptable "no confident match" (Golden Rule 5) rather than a false positive.
# Revisit once more named colours have their own real measurement (see `colour_reference_lab`'s
# own per-entry caveats above) -- this number is calibrated against ONE colour pair (blue vs
# claret) on ONE instant of ONE match, not a general-purpose constant.
# to count as a confident match -- otherwise `nearest_track_by_colour` returns `None` (Golden
# Rule 5: caption-only, no red box, rather than a forced guess). 40 sits at roughly half the
# smallest gap between any two of this table's OWN reference colours (e.g. white/grey = 46.4,
# black/navy = 79.9) -- close enough to catch real lighting/kit-shade variation around a named
# colour without being so loose it would also accept a genuinely different colour.

track_association:
  match_tolerance_s: 0.2 # a candidate track must have a box within this many seconds of the
  # annotation's own timestamp to be considered "at that instant" at all -- one sampled-frame
  # step of slop at `configs/hardware.yaml: stages.track.fps_sample`=10 (~0.1s apart), matching
  # the reasoning `configs/highlights.yaml: selection.arrow_match_tolerance_s` already uses for an
  # identical "is this the same instant" judgement.
  window_s: 1.0 # decode a short window this many seconds EITHER SIDE of the annotation's own `t`
  # (clamped into the take) -- only THIS instant's identity matters for manual-mode association,
  # unlike `src.team.classifier.collect_track_crops`'s own take-wide sampling (which answers "this
  # track's colour ALL TAKE", a different question team clustering needs but this doesn't).
  fps_sample: 5 # cheap enough for a ~2s window to decode near-instantly, dense enough that a
  # genuine 0.2s match_tolerance_s window contains multiple samples to median across.
  min_box_height_px: 25 # identical value/reasoning to `configs/team.yaml: sampling.min_box_height_px`
  # -- below this a torso crop carries essentially no reliable colour signal (CLAUDE.md §3.2).
  torso_top_frac: 0.15 # identical values to `configs/team.yaml: sampling.torso_top_frac/
  torso_bottom_frac: 0.50 # torso_bottom_frac/torso_x_inset_frac` -- the same measured band that
  torso_x_inset_frac: 0.18 # gave a clean CIELAB separation on clip2 (ADR-12), reused here rather
  # than cross-imported per this project's own "independently runnable stage configs" convention
  # (see e.g. configs/events.yaml: touch.match_tolerance_s's identical duplication precedent).

event_window_seconds: 1.0 # An annotation records a single INSTANT the client watched (a touch,
# a pass, ...), not a measured [t_start, t_end] interval the way an auto-detector's heuristic
# produces one. When converting an Annotation into an Event (src/annotations/parse.py::
# annotation_to_event), t_end = t_start + event_window_seconds -- a short, symmetric-feeling
# window long enough that highlight-clip cutting (configs/highlights.yaml: clip.pre_roll_s/
# post_roll_s, which are added on top of this) has a non-degenerate [t_start, t_end] to work with,
# short enough that it stays "this instant", not a fabricated multi-second duration the client
# never actually specified.

# ---------------------------------------------------------------------------------------------
# Jersey-number OCR/VLM as a periodic re-identification signal ("streamed-gathering-treehouse"
# plan, Stage B). Real testing on broadcast footage (chelsea_burnley_target10/target2) found the
# identity LOCK (above) is correct but locks onto a raw ByteTrack chain with real, large coverage
# gaps (26.6%/52.0% of a 61.3s take) -- dense, visually-similar players fragment the tracker
# badly, exactly where goals happen. Two teammates in identical kit are only distinguishable by
# the printed number, which colour-matching structurally cannot read -- so `src.annotations.
# associate.read_jersey_number_for_candidates` reuses the SAME OCR-first/VLM-escalation stack
# ADR-15 already built (`src/identity/jersey_ocr.py`, `jersey_vlm.py`), at two decision points
# only (never a per-frame scan across the whole video, cost bounded by design):
#   1. Establishing the INITIAL LOCK for a jersey number in a take -- a confident digit read
#      matching the annotation's own claimed number is preferred over/corroborates the colour
#      pick (a printed number is stronger evidence than kit colour, which several teammates share).
#   2. RE-ACQUIRING after the locked chain has no member near a later annotation's own instant --
#      before giving up (the honest "locked_identity_absent_at_instant" result), the search
#      reopens among ALL near-time candidates, but is allowed to accept one ONLY on a confident
#      jersey-number match (never on colour proximity alone outside the lock -- that would
#      reintroduce the exact cross-player swap the lock itself was built to prevent).
# Reuses `identity.yaml: crop.min_crop_height_frac`/`ocr`/`vlm` verbatim for the size gate and the
# OCR/VLM engines themselves (one calibrated pair of thresholds, not two divergent copies) --
# the only NEW knob this stage needs is how many Gemini calls a SINGLE lock/reacquisition attempt
# may spend, scoped much tighter than ADR-15's own per-TAKE budget (`vlm.max_escalations_per_take:
# 6`) since this fires at most twice per jersey number per take (once at lock, once per
# reacquisition gap), not continuously across a whole take's worth of frames.
jersey_reid:
  enabled: true # global off-switch: when false, manual-mode identity association falls back to
  # the pre-Stage-B colour(+arrow)-only behaviour unconditionally (e.g. no GEMINI_API_KEY
  # available at all makes VLM escalation moot, but OCR alone still runs when enabled).
  # ⚠️ REVISED 2026-08-31 -- owner-reported real misidentification on `chelsea_burnley_target10`
  # (annotation_report.json, t=57.0s): a colour-only lock silently picked the WRONG one of ~10+
  # identically-dressed teammates; the ORIGINAL one-crop-per-candidate design gave jersey
  # confirmation only a single snapshot's worth of odds to rescue it, and that one snapshot's own
  # box height (70-97px across the whole track's lifespan, measured directly) sat at/below
  # EasyOCR's reliable floor. Two changes below close this gap: sample multiple frames across each
  # CANDIDATE's own lifespan (not one instant) and require temporal agreement
  # (`identity.yaml: aggregation`, reused directly) before trusting a digit, and raise the VLM
  # budget to match (a single call almost never wins now that the pattern is "vote across several
  # tries", not "one shot").
  max_vlm_escalations_per_call: 6 # was 2 -- raised to match identity.yaml's OWN per-take budget
  # (same reasoning: this call now samples MULTIPLE frames per candidate, mirroring a scaled-down
  # version of ADR-15's own per-take verification loop, so it needs a comparable budget to actually
  # accumulate >= aggregation.min_agreeing_frames real reads rather than exhausting itself on the
  # very first ambiguous crop). Still a hard ceiling shared across EVERY candidate in this one
  # call, not per-candidate -- a take with many same-kit candidates still cannot turn this into an
  # unbounded VLM scan; real measured cost per test video is reported in the plan's own
  # verification stage, not assumed here.
  max_frames_per_candidate: 20 # RAISED from 3 (2026-09-01, ADR-21 follow-up) -- 3 was starving
  # this stage so badly that it never once succeeded. Measured across all four real association
  # calls on video2 + video3: 39-48 crops considered per call yielded only 7-11 confident reads
  # (~21%), spread over ~16 candidates -- about 0.6 reads per candidate, against an
  # `identity.yaml: aggregation.min_agreeing_frames` bar of 2. Every call returned `no_match`, so
  # identity silently fell back to the old colour-only path, which is exactly the misidentification
  # this whole stage exists to prevent. The original value's own reasoning ("3 attempts gives a
  # real chance at 2 agreeing") assumed a far higher per-crop yield than the footage delivers.
  # Sized from the measured yield rather than guessed: at p=0.21 per crop, P(>=2 confident reads)
  # is 0.06 at n=3, 0.56 at n=12, and 0.94 at n=20. Cost stays local and cheap -- the gate is a
  # resnet34 and PARSeq is small (a 2,564-crop scan runs in ~2 min on the A2000), and note
  # `n_legible == n_parseq_confident` in all four calls, so the legibility gate, not PARSeq, is
  # the limiter. VLM cost does NOT scale with this: `max_vlm_escalations_per_call` remains a hard
  # per-call ceiling.
  # (original note, still true) sample up to this many frames spread across
  # EACH candidate's own box lifespan (`src.annotations.associate._candidate_target_timestamps`),
  # not just one crop near the annotation's own instant -- a player side-on at that exact moment
  # may be facing the camera elsewhere in the same track. Reasoned (not separately measured): the
  # SAME order of magnitude as `identity.yaml: aggregation.min_agreeing_frames` (2) plus one spare
  # try, since >= 2 independent AGREEING reads are required before a candidate counts as confirmed
  # -- 3 attempts gives a real chance at 2 agreeing even if one of the three is ambiguous/wrong.
  min_disambiguation_margin: 0.20 # ADR-21 follow-up. When MORE THAN ONE candidate track verifies
  # as the SAME claimed number -- physically impossible, only one player wears it -- prefer the
  # better-supported track if it leads the runner-up by at least this much AGREEMENT FRACTION
  # (share of that candidate's own reads backing the number); otherwise keep the honest
  # "ambiguous -> caption only, no box" outcome rather than guessing (Golden Rule 5).
  # Measured cause of the real collision on `chelsea_burnley_target10` take 0: a ByteTrack ID
  # SWITCH, not an OCR failure -- track 201 visibly contains a claret Burnley player at t=39s and
  # Chelsea's blue #10 at t=50s, so it picks up a PARTIAL set of the real holder's reads (44%)
  # while the true, clean #10 chain (track 191, confirmed by eye) sits at 73%. A 0.29 real margin.
  # 0.20 is set BELOW that observed gap so the correct pick survives, but high enough that two
  # genuinely comparable claims stay ambiguous. Compared against the raw agreement fraction, NOT
  # the blended `confidence`, half of which is PARSeq's own uncalibrated self-confidence (ADR-21).
  # ⚠️ Calibrated on ONE observed collision -- a conservative rule, not a well-sampled threshold.
