# ADR-20 (CLAUDE.md §5.1) -- human-marked goal-mouth region(s) for the "ball into the box = goal"
# detector (`src.events.goals.detect_goals_goal_region`). Deliberately EMPTY by default: a slug
# absent from `regions` below means no polygon was ever drawn for that video, so the goal-region
# path is simply INACTIVE for it and goal detection honestly falls back to "not available" (Golden
# Rule 5) -- never a guessed/typical goal-mouth position. Same human-in-the-loop, no-training
# discipline as ADR-3's assisted 4-point pitch calibration: only the OWNER, having actually
# watched a specific clip, draws a polygon for it.
#
# Format: `regions: {<video_slug>: [[[x1, y1], [x2, y2], ...], ...]}`
#   - `<video_slug>` matches `src.common.io.work_dir_for()`'s own slug (e.g. "clip2_77" for
#     `input/clip2 77.mp4`, or the slugified stem of a filename-less video).
#   - each polygon is a list of `[x, y]` VERTICES as FRACTIONS of the detect-stage decoded frame
#     (same coordinate space as `configs/events.yaml: goal.candidate_regions` -- i.e. Stage 2's
#     downscaled decode resolution, NOT raw native/4K pixels), so one polygon travels correctly
#     across a re-run at a different `configs/hardware.yaml: decode.scale_width`.
#   - a slug MAY have more than one polygon (e.g. both goal mouths visible in one static wide
#     shot) -- `detect_goals_goal_region` checks the ball centroid against every polygon for the
#     slug and treats an "inside ANY of them" as one candidate crossing.
#
# Example (commented out -- uncomment and adjust after actually watching the specific clip; never
# copy these numbers as a "typical" goal-mouth position for a different video):
# regions:
#   clip2_77:
#     - [[0.82, 0.35], [0.95, 0.35], [0.95, 0.55], [0.82, 0.55]]

regions: {}
# clip1_43's own hand-typed polygon (owner-confirmed 2026-08-31, goal ~7.0s) lived here through
# the "streamed-gathering-treehouse" plan's Stage C -- REMOVED 2026-08-31 (Stage G) after
# confirming, with two real extracted frames (t=6.5s and t=7.0s of
# output/clip1_43/original_annotated_video.mp4), that Stage C's own auto-tracked goal structure
# (src/goal/detect.py) sits directly on the real goal frame at both timestamps -- the same anti-
# pattern (a hand-typed polygon for one specific clip) this whole plan exists to make unnecessary,
# now genuinely covered automatically. This is the exact scenario this file's own header
# documents as the intended lifecycle: a manual polygon stays alive ONLY as a fallback for a take
# Stage C can't confidently localize; clip1_43 is not (any more) such a take.
#
# Honest caveat, not swept under the rug: removing this polygon does not change clip1_43's own
# `Goals: not available` outcome either way. Direct comparison (manual-only vs Stage-C-detected
# geometry, same cached track/ball data) showed BOTH report "not available" -- the real blocker is
# a SEPARATE, pre-existing precondition in `detect_goals_goal_region` (the ball's own measured
# speed on this footage stays elevated for nearly the whole take, so `find_threshold_segments`
# never reports a "fast window" ENDING shortly before the ball's actual polygon crossing, which
# `detect_goals_goal_region` requires) -- unrelated to which geometry source supplies the polygon,
# and out of this plan's stated scope ("the polygon TEST itself stays, only where the polygon
# comes from changes"). Not fixed here; flagged as a genuine limitation in the plan's own report.
