<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The Reach Vision is restarting</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="10">
<style>
  :root{--bg:#0f1115;--fg:#e8eaed;--muted:#9aa0a6;--accent:#24bb61}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
       font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  main{max-width:520px}
  h1{font-size:1.5rem;margin:0 0 .5rem}
  p{margin:.5rem 0;color:var(--muted)}
  code{background:#1c1f26;padding:.1em .4em;border-radius:4px;color:var(--fg)}
  .dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--accent);margin-right:.4em;
       animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style></head>
<body><main>
  <h1><span class="dot"></span>The Reach Vision is restarting</h1>
  <p>The site's gateway service is coming back up (this happens for a few seconds after an update).
     This page refreshes itself every 10&nbsp;s.</p>
  <p>Still here after a minute? On the VPS: <code>systemctl status pitchvision-gateway</code> and
     <code>journalctl -u pitchvision-gateway -n 50</code>.</p>
</main></body></html>
