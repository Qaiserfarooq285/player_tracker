# PitchVision -- nginx reverse proxy on the Hostinger KVM VPS (docs/DEPLOY.md "VPS front door").
#
# Installed by docker/vps/setup_vps.sh as /etc/nginx/sites-available/pitchvision with the two
# placeholders below substituted:
#   __DOMAIN__   e.g. app.example.com   (the A record points at this VPS)
#   __UPSTREAM__ e.g. abc123xyz-8000.proxy.runpod.net   (the pod's RunPod HTTP proxy host)
#
# certbot --nginx adds the TLS server block + the http->https redirect itself, so this file
# only ever describes the plain-HTTP vhost and the proxy rules.

# Cache the DNS answer for the RunPod proxy host; it can change when RunPod rotates edges.
resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Uploads arrive in 24 MB slices (apps/web/js/app.js UPLOAD_CHUNK_BYTES); 64m leaves headroom.
    client_max_body_size 64m;
    # A pipeline poll or a reel download can be slow through two proxies; don't cut it short.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 30s;
    # Stream video responses instead of spooling them to the VPS disk first.
    proxy_buffering off;
    proxy_request_buffering off;

    # Shown when the pod is stopped (idle auto-stop or a manual Stop): the RunPod proxy answers
    # with a 5xx, and this is friendlier than nginx's default page.
    error_page 502 503 504 /pod-offline.html;
    location = /pod-offline.html {
        root /var/www/pitchvision;
        internal;
    }

    location / {
        set $upstream __UPSTREAM__;
        proxy_pass https://$upstream;
        proxy_http_version 1.1;

        # The RunPod proxy routes on the Host header + SNI, so both must carry the proxy host.
        proxy_set_header Host $upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;

        # The app reads X-Forwarded-Proto to decide whether its session cookie may be Secure
        # (apps/api/main.py login()). certbot's TLS block inherits this location, so on the
        # https vhost $scheme is "https".
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_intercept_errors on;
    }
}
