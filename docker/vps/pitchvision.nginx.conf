# PitchVision -- nginx on the Hostinger KVM VPS, in front of the always-on gateway
# (docs/DEPLOY.md "Always-on gateway").
#
# Installed by docker/vps/setup_vps.sh as /etc/nginx/sites-available/pitchvision with __DOMAIN__
# substituted. nginx only terminates TLS here; the gateway (apps/gateway, systemd unit
# pitchvision-gateway, 127.0.0.1:8100) serves the frontend, takes uploads, and talks to whichever
# RunPod pod currently exists -- so nothing in this file changes when the pod is recreated.
#
# certbot --nginx adds the TLS server block + the http->https redirect itself, so this file only
# ever describes the plain-HTTP vhost and the proxy rules.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Uploads arrive in 24 MB slices (apps/api/uploads.py UPLOAD_CHUNK_BYTES); 64m leaves headroom.
    client_max_body_size 64m;
    # A results fetch or a reel download crosses two proxies (VPS -> RunPod); don't cut it short.
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    proxy_connect_timeout 30s;
    # Stream video responses instead of spooling them to disk first.
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The gateway reads X-Forwarded-Proto to decide whether its session cookie may be Secure
    # (apps/gateway/main.py login()). certbot's TLS block inherits these, so there $scheme is "https".
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Only while the gateway itself is restarting (a few seconds after a deploy).
    error_page 502 503 504 =503 /gateway-offline.html;
    location = /gateway-offline.html {
        root /var/www/pitchvision;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
    }
}
